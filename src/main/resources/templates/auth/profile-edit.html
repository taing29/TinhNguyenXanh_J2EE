<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{shared/layout :: head('Chỉnh sửa hồ sơ')}">
  <style>
    .avatar-preview { width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid #e8f5e9; }
    .avatar-default { width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#2e7d32,#66bb6a);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:#fff;border:3px solid #e8f5e9; }
    #avatar-input { display:none; }
    .avatar-label { cursor:pointer; }
  </style>
</head>
<body>
<nav th:replace="~{shared/layout :: navbar('')}"></nav>
<div th:replace="~{shared/layout :: flash}"></div>

<main>
  <div class="container profile-page">
    <div class="row g-4 align-items-start">
      <div class="col-lg-4">
        <div th:replace="~{shared/volunteer-profile-shell :: shell(${user}, ${volunteer}, ${totalRegs}, ${confirmedRegs}, 'profile')}"></div>
      </div>

      <div class="col-lg-8">
        <div class="d-flex align-items-center mb-4">
          <a th:href="@{/auth/profile}" class="btn btn-outline-secondary btn-sm me-3">
            <i class="bi bi-arrow-left"></i>
          </a>
          <h3 class="fw-bold mb-0">Chỉnh sửa hồ sơ</h3>
        </div>

        <div class="card border-0 shadow-sm p-4">
          <form th:action="@{/auth/profile/edit}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <!-- Avatar upload -->
            <div class="text-center mb-4">
              <label for="avatar-input" class="avatar-label d-inline-block position-relative">
                <img th:if="${user.avatarPath != null}" th:src="${user.avatarPath}"
                     id="avatar-preview" class="avatar-preview" alt="avatar"/>
                <div th:unless="${user.avatarPath != null}"
                     id="avatar-placeholder" class="avatar-default"
                     th:text="${user.fullName.substring(0,1)}">A</div>
                <span class="position-absolute bottom-0 end-0 bg-success rounded-circle p-1"
                      style="width:28px;height:28px;display:flex;align-items:center;justify-content:center">
                  <i class="bi bi-camera-fill text-white" style="font-size:.7rem"></i>
                </span>
              </label>
              <input type="file" id="avatar-input" name="avatarFile" accept="image/*"
                     onchange="previewAvatar(this)"/>
              <div class="text-muted small mt-2">Nhấn vào ảnh để thay đổi</div>
            </div>

            <h6 class="fw-bold text-success mb-3 border-bottom pb-2">Thông tin cơ bản</h6>
            <div class="mb-3">
              <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
              <input type="text" name="fullName" class="form-control"
                     th:value="${user.fullName}" required/>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Số điện thoại</label>
                <input type="text" name="phone" class="form-control"
                       th:value="${user.phoneNumber}" placeholder="0901234567"/>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label fw-semibold">Tuổi</label>
                <input type="number" name="age" class="form-control"
                       th:value="${user.age}" placeholder="22" min="1" max="120"/>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Địa chỉ</label>
              <input type="text" name="address" class="form-control"
                     th:value="${user.address}" placeholder="TP. Hồ Chí Minh"/>
            </div>

            <h6 class="fw-bold text-success mb-3 border-bottom pb-2 mt-4">Hồ sơ tình nguyện</h6>
            <div class="mb-3">
              <label class="form-label fw-semibold">Giới thiệu bản thân</label>
              <textarea name="bio" class="form-control" rows="3"
                        placeholder="Mô tả ngắn về bản thân bạn..."
                        th:text="${volunteer != null ? volunteer.bio : ''}"></textarea>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Kỹ năng</label>
              <input type="text" name="skills" class="form-control"
                     th:value="${volunteer != null ? volunteer.skills : ''}"
                     placeholder="VD: Lái xe, Y tế, Giảng dạy (phân cách bởi dấu phẩy)"/>
              <div class="form-text">Phân cách nhiều kỹ năng bằng dấu phẩy</div>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-check-lg me-2"></i>Lưu thay đổi
              </button>
              <a th:href="@{/auth/profile}" class="btn btn-outline-secondary px-4">Hủy</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{shared/layout :: footer}"></footer>
<th:block th:replace="~{shared/layout :: scripts}"></th:block>
<script>
function previewAvatar(input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = e => {
    let preview = document.getElementById('avatar-preview');
    const placeholder = document.getElementById('avatar-placeholder');
    if (!preview) {
      preview = document.createElement('img');
      preview.id = 'avatar-preview';
      preview.className = 'avatar-preview';
      preview.alt = 'avatar';
      if (placeholder) placeholder.replaceWith(preview);
    }
    preview.src = e.target.result;
  };
  reader.readAsDataURL(input.files[0]);
}
</script>
</body>
</html>
