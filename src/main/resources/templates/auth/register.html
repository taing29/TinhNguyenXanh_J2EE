<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/layout :: head('Đăng ký')}">
  <style>
    body { background: #f1f8e9; padding: 40px 0; }
    .card { border: none; box-shadow: 0 8px 32px rgba(46,125,50,.15); border-radius: 16px; }
    .is-invalid ~ .invalid-feedback { display: block; }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="text-center mb-4 mt-3">
        <a th:href="@{/}" class="text-decoration-none">
          <span style="color:#2e7d32;font-weight:700;font-size:1.8rem">🌿 Tình Nguyện Xanh</span>
        </a>
      </div>
      <div class="card p-4">
        <div class="text-center mb-4">
          <h4 class="fw-bold">Tạo tài khoản mới</h4>
          <p class="text-muted small">Tham gia cộng đồng tình nguyện xanh</p>
        </div>

        <form th:action="@{/auth/register}" th:object="${registerDTO}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="mb-3">
            <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
            <input type="text" th:field="*{fullName}"
                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                   class="form-control" placeholder="Nguyễn Văn A"/>
            <div class="invalid-feedback" th:errors="*{fullName}"></div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
            <input type="email" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                   class="form-control" placeholder="your@email.com"/>
            <div class="invalid-feedback" th:errors="*{email}"></div>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
              <input type="password" th:field="*{password}"
                     th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                     class="form-control" placeholder="••••••••"/>
              <div class="invalid-feedback" th:errors="*{password}"></div>
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
              <input type="password" th:field="*{confirmPassword}"
                     th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                     class="form-control" placeholder="••••••••"/>
              <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Số điện thoại</label>
            <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="0901234567"/>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Địa chỉ</label>
            <input type="text" th:field="*{address}" class="form-control" placeholder="TP. Hồ Chí Minh"/>
          </div>

          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary btn-lg">Đăng ký</button>
          </div>
        </form>

        <hr/>
        <p class="text-center mb-0">Đã có tài khoản?
          <a th:href="@{/auth/login}" class="text-success fw-bold">Đăng nhập</a>
        </p>
      </div>
    </div>
  </div>
</div>
<th:block th:replace="~{shared/layout :: scripts}"></th:block>
</body>
</html>
