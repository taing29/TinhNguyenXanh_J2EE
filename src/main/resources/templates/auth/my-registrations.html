<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{shared/layout :: head('Đăng ký của tôi')}">
  <style>/* replaced */</style>
</head>
<body>
<nav th:replace="~{shared/layout :: navbar('')}"></nav>
<div th:replace="~{shared/layout :: flash}"></div>

<style>
  :root {
    --green:#2e7d32; --green-dark:#1b5e20; --green-light:#f0fdf4;
    --green-border:#bbf7d0; --text:#0f172a; --muted:#64748b; --border:#e5e7eb;
    --radius:14px; --shadow:0 2px 10px rgba(0,0,0,.07);
  }

  .profile-card {
    border: 0;
    border-radius: 1.5rem;
    box-shadow: 0 18px 55px rgba(15, 23, 42, 0.08);
    overflow: hidden;
    background: #fff;
  }

  .profile-card-body {
    position: relative;
    z-index: 1;
  }

  .profile-section-title {
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 1rem;
  }

  .page-sub {
    font-size: .87rem;
    color: var(--muted);
  }

  .subtle-box {
    background: linear-gradient(180deg, #f8fbf8 0%, #ffffff 100%);
    border: 1px solid rgba(15, 23, 42, 0.06);
    border-radius: 1rem;
    padding: 1rem;
  }

  .stat-chips { display:flex; gap:.75rem; flex-wrap:wrap; margin-bottom:1.75rem; }
  .stat-chip  {
    display:flex; align-items:center; gap:.5rem;
    background:#fff; border:1px solid var(--border);
    border-radius:10px; padding:.55rem 1rem; font-size:.85rem;
    box-shadow:var(--shadow);
  }
  .stat-chip .num { font-weight:800; font-size:1.1rem; }
  .chip-pending   .num { color:#f59e0b; }
  .chip-confirmed .num { color:var(--green); }
  .chip-rejected  .num { color:#ef4444; }

  .reg-card {
    background:#fff; border:1px solid var(--border);
    border-radius:var(--radius); box-shadow:var(--shadow);
    overflow:hidden; margin-bottom:1rem;
    display:flex; transition:box-shadow .2s;
  }
  .reg-card:hover { box-shadow:0 6px 20px rgba(0,0,0,.1); }

  .status-strip { width:5px; flex-shrink:0; }
  .strip-pending   { background:#f59e0b; }
  .strip-confirmed { background:var(--green); }
  .strip-rejected  { background:#ef4444; }

  .reg-thumb {
    width:110px; height:100%; min-height:100px;
    object-fit:cover; flex-shrink:0; display:block;
  }
  .reg-thumb-placeholder {
    width:110px; background:var(--green-light);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; min-height:100px;
  }
  .reg-thumb-placeholder i { font-size:2rem; color:var(--green-border); }

  .reg-body { padding:1rem 1.1rem; flex:1; min-width:0; display:flex; flex-direction:column; }
  .reg-title { font-weight:700; font-size:.97rem; color:var(--text); margin-bottom:.4rem; text-decoration:none; }
  .reg-title:hover { color:var(--green); }
  .reg-meta  { font-size:.8rem; color:var(--muted); display:flex; align-items:center; gap:.35rem; margin-bottom:.25rem; }

  .reg-footer { display:flex; align-items:center; justify-content:space-between; margin-top:.6rem; flex-wrap:wrap; gap:.5rem; }

  .status-badge {
    display:inline-flex; align-items:center; gap:.35rem;
    border-radius:20px; font-size:.78rem; font-weight:700;
    padding:.22rem .75rem;
  }
  .badge-pending   { background:#fef3c7; color:#92400e; border:1px solid #fde68a; }
  .badge-confirmed { background:var(--green-light); color:var(--green); border:1px solid var(--green-border); }
  .badge-rejected  { background:#fef2f2; color:#dc2626; border:1px solid #fecaca; }

  .btn-view {
    background:var(--green); color:#fff; border:none; border-radius:8px;
    padding:.32rem .8rem; font-size:.8rem; font-weight:600;
    text-decoration:none; display:inline-flex; align-items:center; gap:.28rem;
    transition:background .18s;
  }
  .btn-view:hover { background:var(--green-dark); color:#fff; }

  .empty-box { text-align:center; padding:4rem 2rem; color:var(--muted); }
  .empty-box i { font-size:3rem; display:block; margin-bottom:1rem; color:#d1d5db; }

  @media (max-width:576px) {
    .reg-thumb, .reg-thumb-placeholder { width:80px; }
    .reg-thumb { min-height:80px; }
  }
</style>

<main>
  <div class="container profile-page">
    <div class="row g-4 align-items-start">
      <div class="col-lg-4">
        <div th:replace="~{shared/volunteer-profile-shell :: shell(${user}, ${volunteer}, ${totalRegs}, ${confirmedRegs}, 'registrations')}"></div>
      </div>

      <div class="col-lg-8">
        <div class="card profile-card mb-4">
          <div class="card-body profile-card-body p-4 p-xl-5">
            <div class="d-flex justify-content-between align-items-start gap-3 mb-4">
              <div>
                <div class="profile-section-title mb-2">Đăng ký của tôi</div>
                <h4 class="fw-bold mb-1 mb-sm-2">Theo dõi các sự kiện bạn đã tham gia</h4>
                <p class="page-sub mb-0" th:if="${registrations != null}"
                   th:text="${#lists.size(registrations)} + ' sự kiện đã đăng ký'">0 sự kiện</p>
              </div>
              <a th:href="@{/events}" class="btn btn-outline-success btn-sm rounded-pill flex-shrink-0">
                <i class="bi bi-search me-1"></i>Khám phá thêm
              </a>
            </div>

            <div class="subtle-box mb-4">
              <div class="stat-chips mb-0" th:if="${registrations != null and !#lists.isEmpty(registrations)}">
                <div class="stat-chip chip-pending">
                  <span class="num" th:text="${#lists.size(registrations.?[status == 'Pending'])}">0</span>
                  <span>Chờ duyệt</span>
                </div>
                <div class="stat-chip chip-confirmed">
                  <span class="num" th:text="${#lists.size(registrations.?[status == 'Confirmed'])}">0</span>
                  <span>Đã xác nhận</span>
                </div>
                <div class="stat-chip chip-rejected">
                  <span class="num" th:text="${#lists.size(registrations.?[status == 'Rejected'])}">0</span>
                  <span>Bị từ chối</span>
                </div>
              </div>
            </div>

            <div th:if="${registrations != null and !#lists.isEmpty(registrations)}">
              <div th:each="reg : ${registrations}" class="reg-card">
                <div class="status-strip"
                     th:classappend="${reg.status == 'Confirmed'} ? 'strip-confirmed'
                           : (${reg.status == 'Rejected'} ? 'strip-rejected' : 'strip-pending')"></div>

                <img th:if="${reg.event.images != null and !#strings.isEmpty(reg.event.images)}"
                     th:src="${reg.event.images}" class="reg-thumb" alt="event"/>
                <div th:unless="${reg.event.images != null and !#strings.isEmpty(reg.event.images)}"
                     class="reg-thumb-placeholder">
                  <i class="bi bi-image"></i>
                </div>

                <div class="reg-body">
                  <a th:href="@{/events/{id}(id=${reg.event.id})}" class="reg-title"
                     th:text="${reg.event.title}">Tên sự kiện</a>

                  <div class="reg-meta">
                    <i class="bi bi-calendar3"></i>
                    <span th:text="${#temporals.format(reg.event.startTime,'dd/MM/yyyy HH:mm')}">--</span>
                  </div>
                  <div class="reg-meta">
                    <i class="bi bi-geo-alt"></i>
                    <span th:text="${reg.event.location}">--</span>
                  </div>
                  <div class="reg-meta">
                    <i class="bi bi-clock"></i>
                    Đăng ký lúc:
                    <span th:text="${#temporals.format(reg.registeredDate,'dd/MM/yyyy HH:mm')}">--</span>
                  </div>

                  <div class="reg-footer">
                    <span class="status-badge"
                          th:classappend="${reg.status == 'Confirmed'} ? 'badge-confirmed'
                                : (${reg.status == 'Rejected'} ? 'badge-rejected' : 'badge-pending')">
                      <i th:class="${reg.status == 'Confirmed'} ? 'bi bi-check-circle-fill'
                          : (${reg.status == 'Rejected'} ? 'bi bi-x-circle-fill' : 'bi bi-hourglass-split')"></i>
                      <span th:text="${reg.status == 'Confirmed'} ? 'Đã xác nhận'
                           : (${reg.status == 'Rejected'} ? 'Bị từ chối' : 'Chờ duyệt')">Trạng thái</span>
                    </span>
                    <a th:href="@{/events/{id}(id=${reg.event.id})}" class="btn-view">
                      Xem sự kiện <i class="bi bi-arrow-right"></i>
                    </a>
                  </div>
                </div>
              </div>
            </div>

            <div th:if="${registrations == null or #lists.isEmpty(registrations)}" class="empty-box">
              <i class="bi bi-calendar-x"></i>
              <p class="fw-semibold">Bạn chưa đăng ký sự kiện nào</p>
              <p class="small">Hãy khám phá và tham gia các hoạt động tình nguyện!</p>
              <a th:href="@{/events}" class="btn btn-success btn-sm rounded-pill mt-2 px-4">
                <i class="bi bi-calendar-event me-1"></i>Khám phá sự kiện
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{shared/layout :: footer}"></footer>
<th:block th:replace="~{shared/layout :: scripts}"></th:block>
</body>
</html>
