<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Đăng ký thành công</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container py-5 text-center">
  <div th:if="${success}" class="mb-4">
    <i class="bi bi-check-circle-fill text-success" style="font-size:4rem"></i>
    <h2 class="fw-bold mt-3 text-success">Đăng ký thành công!</h2>
    <p class="text-muted">Tổ chức của bạn đã được gửi và đang chờ admin xét duyệt.</p>
  </div>
  <div th:if="${error}" class="mb-4">
    <h2 class="fw-bold text-danger" th:text="${error}"></h2>
  </div>
  <a th:href="@{/}" class="btn btn-success me-2">Về trang chủ</a>
  <a th:href="@{/events}" class="btn btn-outline-success">Khám phá sự kiện</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
  // bootstrap icons cdn
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</body>
</html>
