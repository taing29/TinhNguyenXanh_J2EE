<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Tổ chức - Tình Nguyện Xanh</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <style>
    :root{--primary:#2e7d32}.btn-primary{background:var(--primary);border-color:var(--primary)}
    .card{border:none;box-shadow:0 2px 12px rgba(0,0,0,.08);transition:.3s}
    .card:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.15)}
    footer{background:#1b5e20;color:#fff}
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold text-success" th:href="@{/}">🌿 Tình Nguyện Xanh</a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" th:href="@{/events}">Sự kiện</a></li>
      <li class="nav-item"><a class="nav-link fw-bold text-success" th:href="@{/organizations}">Tổ chức</a></li>
      <li class="nav-item"><a class="nav-link" th:href="@{/donate}">Quyên góp</a></li>
      <li class="nav-item ms-2">
        <a class="btn btn-outline-success btn-sm" th:href="@{/organizations/register}">Đăng ký tổ chức</a>
      </li>
    </ul>
  </div>
</nav>
<div class="container py-5">
  <h2 class="fw-bold text-success mb-4"><i class="bi bi-building me-2"></i>Tổ chức đối tác</h2>
  <div class="row g-4">
    <div th:each="org : ${organizations}" class="col-md-4">
      <div class="card h-100 p-3">
        <div class="d-flex align-items-center mb-3">
          <img th:if="${org.avatarUrl != null}" th:src="${org.avatarUrl}"
               class="rounded-circle me-3" style="width:60px;height:60px;object-fit:cover" alt="org"/>
          <div th:unless="${org.avatarUrl != null}"
               class="rounded-circle bg-success text-white d-flex align-items-center justify-content-center me-3"
               style="width:60px;height:60px;font-size:1.5rem;font-weight:700"
               th:text="${org.name.substring(0,1)}">O</div>
          <div>
            <h5 class="mb-0 fw-bold" th:text="${org.name}"></h5>
            <small class="text-muted" th:text="${org.organizationType}"></small>
          </div>
        </div>
        <p class="text-muted small flex-grow-1"
           th:text="${#strings.abbreviate(org.description, 100)}"></p>
        <div class="d-flex justify-content-between align-items-center mt-auto">
          <div>
            <span th:if="${org.averageRating != null}" class="text-warning me-1">
              <i class="bi bi-star-fill"></i>
              <span th:text="${#numbers.formatDecimal(org.averageRating,1,1)}"></span>
            </span>
          </div>
          <a th:href="@{/organizations/{id}(id=${org.id})}" class="btn btn-primary btn-sm">Xem chi tiết</a>
        </div>
      </div>
    </div>
  </div>
  <p th:if="${#lists.isEmpty(organizations)}" class="text-center text-muted py-5">
    Chưa có tổ chức nào.
  </p>
</div>
<footer class="py-3 mt-5"><div class="container text-center"><p class="mb-0">🌿 Tình Nguyện Xanh &copy; 2025</p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
