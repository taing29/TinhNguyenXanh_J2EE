<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/layout :: head('Yêu thích')}"></head>
<body>
<nav th:replace="~{shared/layout :: navbar('events')}"></nav>
<div th:replace="~{shared/layout :: flash}"></div>
<main>
  <div class="container py-5">
    <h2 class="fw-bold text-success mb-4"><i class="bi bi-heart me-2"></i>Sự kiện yêu thích</h2>
    <div class="row g-4">
      <div th:each="fav : ${favorites}" class="col-md-4">
        <div class="card h-100 border-0" style="box-shadow:0 2px 8px rgba(0,0,0,.1)">
          <img th:if="${fav.event.images != null}" th:src="${fav.event.images}"
               class="card-img-top" style="height:180px;object-fit:cover" alt="event"/>
          <img th:unless="${fav.event.images != null}"
               src="https://via.placeholder.com/400x180?text=No+Image"
               class="card-img-top" style="height:180px;object-fit:cover" alt="event"/>
          <div class="card-body">
            <h5 class="card-title" th:text="${fav.event.title}"></h5>
            <p class="text-muted small"><i class="bi bi-geo-alt me-1"></i><span th:text="${fav.event.location}"></span></p>
            <p class="text-muted small"><i class="bi bi-calendar me-1"></i>
              <span th:text="${#temporals.format(fav.event.startTime,'dd/MM/yyyy')}"></span>
            </p>
            <a th:href="@{/events/{id}(id=${fav.event.id})}" class="btn btn-primary btn-sm w-100">Xem chi tiết</a>
          </div>
        </div>
      </div>
    </div>
    <p th:if="${favorites == null or #lists.isEmpty(favorites)}" class="text-center text-muted py-4">
      Bạn chưa yêu thích sự kiện nào. <a th:href="@{/events}" class="text-success">Khám phá ngay!</a>
    </p>
  </div>
</main>
<footer th:replace="~{shared/layout :: footer}"></footer>
<th:block th:replace="~{shared/layout :: scripts}"></th:block>
</body>
</html>
