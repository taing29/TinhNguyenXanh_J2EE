<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{shared/layout :: head('Sự kiện')}">
  <style>
    .event-card { transition: .3s; border: none; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .event-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  </style>
</head>
<body>

<nav th:replace="~{shared/layout :: navbar('events')}"></nav>
<div th:replace="~{shared/layout :: flash}"></div>

<main>
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="fw-bold text-success"><i class="bi bi-calendar-event me-2"></i>Tất cả sự kiện</h2>
      <form th:action="@{/search}" method="get" class="d-flex">
        <input name="keyword" class="form-control me-2" placeholder="Tìm kiếm sự kiện..."/>
        <button class="btn btn-outline-success" type="submit"><i class="bi bi-search"></i></button>
      </form>
    </div>

    <div class="row g-4">
      <div th:each="event : ${events}" class="col-md-4">
        <div class="card event-card h-100">
          <img th:if="${event.images != null}" th:src="${event.images}"
               class="card-img-top" style="height:200px;object-fit:cover" alt="event"/>
          <img th:unless="${event.images != null}"
               src="https://via.placeholder.com/400x200?text=No+Image"
               class="card-img-top" style="height:200px;object-fit:cover" alt="event"/>
          <div class="card-body d-flex flex-column">
            <span class="badge bg-success mb-2" style="width:fit-content"
                  th:text="${event.categoryName}">Danh mục</span>
            <h5 class="card-title" th:text="${event.title}">Tiêu đề</h5>
            <p class="text-muted small flex-grow-1"
               th:text="${#strings.abbreviate(event.description, 100)}">Mô tả</p>
            <div class="mt-auto">
              <p class="text-muted small mb-1">
                <i class="bi bi-geo-alt me-1"></i><span th:text="${event.location}"></span>
              </p>
              <p class="text-muted small mb-2">
                <i class="bi bi-calendar me-1"></i>
                <span th:text="${#temporals.format(event.startTime,'dd/MM/yyyy HH:mm')}"></span>
              </p>
              <div class="d-flex justify-content-between align-items-center">
                <span class="badge bg-secondary">
                  <i class="bi bi-people me-1"></i>
                  <span th:text="${event.registeredCount + '/' + event.maxVolunteers}"></span>
                </span>
                <div class="d-flex gap-1">
                  <form sec:authorize="isAuthenticated()"
                        th:action="@{/events/{id}/favorite(id=${event.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-outline-danger btn-sm" title="Yêu thích">
                      <i class="bi bi-heart"></i>
                    </button>
                  </form>
                  <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-primary btn-sm">
                    Chi tiết <i class="bi bi-arrow-right"></i>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(events)}" class="text-center py-5 text-muted">
      <i class="bi bi-calendar-x display-4"></i>
      <p class="mt-3">Chưa có sự kiện nào được duyệt</p>
    </div>
  </div>
</main>

<footer th:replace="~{shared/layout :: footer}"></footer>
<th:block th:replace="~{shared/layout :: scripts}"></th:block>
</body>
</html>
