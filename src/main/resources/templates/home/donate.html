<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Quyên góp - Tình Nguyện Xanh</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <style>:root{--primary:#2e7d32}.btn-primary{background:var(--primary);border-color:var(--primary)}.navbar-brand{color:var(--primary)!important;font-weight:700} footer{background:#1b5e20;color:#fff}</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">🌿 Tình Nguyện Xanh</a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" th:href="@{/}">Trang chủ</a></li>
      <li class="nav-item"><a class="nav-link" th:href="@{/events}">Sự kiện</a></li>
    </ul>
  </div>
</nav>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm p-4">
        <div class="text-center mb-4">
          <i class="bi bi-heart-fill text-danger" style="font-size:3rem"></i>
          <h3 class="fw-bold mt-2">Quyên góp ủng hộ</h3>
          <p class="text-muted">Mỗi đóng góp của bạn là một bước xây dựng cộng đồng xanh</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/donate}" th:object="${donationDTO}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

          <div class="mb-3">
            <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
            <input type="text" th:field="*{donorName}"
                   th:classappend="${#fields.hasErrors('donorName')} ? 'is-invalid'"
                   class="form-control" placeholder="Nguyễn Văn A"/>
            <div class="invalid-feedback" th:errors="*{donorName}"></div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Số tiền (VNĐ) <span class="text-danger">*</span></label>
            <div class="d-flex gap-2 mb-2">
              <button type="button" class="btn btn-outline-success btn-sm" onclick="setAmount(50000)">50.000</button>
              <button type="button" class="btn btn-outline-success btn-sm" onclick="setAmount(100000)">100.000</button>
              <button type="button" class="btn btn-outline-success btn-sm" onclick="setAmount(200000)">200.000</button>
              <button type="button" class="btn btn-outline-success btn-sm" onclick="setAmount(500000)">500.000</button>
            </div>
            <input type="number" th:field="*{amount}" id="amountInput"
                   th:classappend="${#fields.hasErrors('amount')} ? 'is-invalid'"
                   class="form-control" placeholder="Nhập số tiền..." min="10000"/>
            <div class="invalid-feedback" th:errors="*{amount}"></div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Số điện thoại <span class="text-danger">*</span></label>
            <input type="text" th:field="*{phoneNumber}" class="form-control" placeholder="0901234567"/>
          </div>

          <div class="mb-4">
            <label class="form-label fw-semibold">Lời nhắn (tùy chọn)</label>
            <textarea th:field="*{message}" class="form-control" rows="2" placeholder="Gửi lời chúc đến cộng đồng..."></textarea>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-danger btn-lg">
              <i class="bi bi-heart me-2"></i>Quyên góp qua MoMo
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<footer class="py-3 mt-5"><div class="container text-center"><p class="mb-0">🌿 Tình Nguyện Xanh &copy; 2025</p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>function setAmount(val){ document.getElementById('amountInput').value = val; }</script>
</body>
</html>
