<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/admin-layout :: head('Dashboard')}"></head>
<body>
<div th:replace="~{shared/admin-layout :: sidebar('dashboard')}"></div>
<div class="main-content">
  <div class="content-area">
    <h3 class="fw-bold mb-4">📊 Dashboard</h3>
    <div th:replace="~{shared/admin-layout :: flash}"></div>

    <div class="row g-4 mb-5">
      <div class="col-md-3">
        <div class="card stat-card p-4 text-center">
          <i class="bi bi-calendar-event display-5 text-primary mb-2"></i>
          <h3 class="fw-bold" th:text="${totalEvents}">0</h3>
          <p class="text-muted mb-0">Tổng sự kiện</p>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card stat-card p-4 text-center">
          <i class="bi bi-hourglass-split display-5 text-warning mb-2"></i>
          <h3 class="fw-bold" th:text="${pendingEvents}">0</h3>
          <p class="text-muted mb-0">Chờ duyệt</p>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card stat-card p-4 text-center">
          <i class="bi bi-people display-5 text-success mb-2"></i>
          <h3 class="fw-bold" th:text="${totalUsers}">0</h3>
          <p class="text-muted mb-0">Người dùng</p>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card stat-card p-4 text-center">
          <i class="bi bi-building display-5 text-info mb-2"></i>
          <h3 class="fw-bold" th:text="${pendingOrgs}">0</h3>
          <p class="text-muted mb-0">Tổ chức chờ duyệt</p>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-md-6">
        <div class="card p-4">
          <h5 class="fw-bold mb-3">Thao tác nhanh</h5>
          <div class="d-grid gap-2">
            <a th:href="@{/admin/events}" class="btn btn-outline-primary">
              <i class="bi bi-calendar-check me-2"></i>Duyệt sự kiện
            </a>
            <a th:href="@{/admin/organizations}" class="btn btn-outline-success">
              <i class="bi bi-building-check me-2"></i>Duyệt tổ chức
            </a>
            <a th:href="@{/admin/users}" class="btn btn-outline-secondary">
              <i class="bi bi-person-gear me-2"></i>Quản lý người dùng
            </a>
            <a th:href="@{/admin/categories}" class="btn btn-outline-info">
              <i class="bi bi-tags me-2"></i>Quản lý danh mục
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<th:block th:replace="~{shared/admin-layout :: scripts}"></th:block>
</body>
</html>
