<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Admin - Tình Nguyện Xanh</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <style>
    body{display:flex;min-height:100vh}
    .sidebar{width:250px;background:#1b5e20;color:#fff;min-height:100vh;flex-shrink:0}
    .sidebar a{color:rgba(255,255,255,.8);text-decoration:none;padding:12px 20px;display:block;transition:.2s}
    .sidebar a:hover,.sidebar a.active{background:rgba(255,255,255,.15);color:#fff}
    .sidebar .brand{padding:20px;font-size:1.2rem;font-weight:700;border-bottom:1px solid rgba(255,255,255,.2)}
    .main{flex:1;background:#f8f9fa}
    .stat-card{border:none;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  </style>
</head>
<body>
<div class="sidebar">
  <div class="brand">🌿 Admin Panel</div>
  <nav class="mt-2">
    <a th:href="@{/admin/dashboard}" class="active"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
    <a th:href="@{/admin/events}"><i class="bi bi-calendar-event me-2"></i>Sự kiện</a>
    <a th:href="@{/admin/organizations}"><i class="bi bi-building me-2"></i>Tổ chức</a>
    <a th:href="@{/admin/users}"><i class="bi bi-people me-2"></i>Người dùng</a>
    <a th:href="@{/admin/categories}"><i class="bi bi-tags me-2"></i>Danh mục</a>
    <a th:href="@{/admin/reports}"><i class="bi bi-flag me-2"></i>Báo cáo</a>
    <hr style="border-color:rgba(255,255,255,.2);margin:8px 16px"/>
    <a th:href="@{/}"><i class="bi bi-house me-2"></i>Trang chủ</a>
    <form th:action="@{/auth/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn text-white w-100 text-start ps-4" type="submit">
        <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
      </button>
    </form>
  </nav>
</div>

<div class="main p-4">
  <h3 class="fw-bold mb-4">📊 Dashboard</h3>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="row g-4 mb-5">
    <div class="col-md-3">
      <div class="card stat-card p-4 text-center">
        <i class="bi bi-calendar-event display-5 text-primary mb-2"></i>
        <h3 class="fw-bold" th:text="${totalEvents}">0</h3>
        <p class="text-muted mb-0">Tổng sự kiện</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card p-4 text-center">
        <i class="bi bi-hourglass-split display-5 text-warning mb-2"></i>
        <h3 class="fw-bold" th:text="${pendingEvents}">0</h3>
        <p class="text-muted mb-0">Chờ duyệt</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card p-4 text-center">
        <i class="bi bi-people display-5 text-success mb-2"></i>
        <h3 class="fw-bold" th:text="${totalUsers}">0</h3>
        <p class="text-muted mb-0">Người dùng</p>
      </div>
    </div>
    <div class="col-md-3">
      <div class="card stat-card p-4 text-center">
        <i class="bi bi-building display-5 text-info mb-2"></i>
        <h3 class="fw-bold" th:text="${pendingOrgs}">0</h3>
        <p class="text-muted mb-0">Tổ chức chờ duyệt</p>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-6">
      <div class="card p-4">
        <h5 class="fw-bold mb-3">Thao tác nhanh</h5>
        <div class="d-grid gap-2">
          <a th:href="@{/admin/events}" class="btn btn-outline-primary">
            <i class="bi bi-calendar-check me-2"></i>Duyệt sự kiện
          </a>
          <a th:href="@{/admin/organizations}" class="btn btn-outline-success">
            <i class="bi bi-building-check me-2"></i>Duyệt tổ chức
          </a>
          <a th:href="@{/admin/users}" class="btn btn-outline-secondary">
            <i class="bi bi-person-gear me-2"></i>Quản lý người dùng
          </a>
          <a th:href="@{/admin/categories}" class="btn btn-outline-info">
            <i class="bi bi-tags me-2"></i>Quản lý danh mục
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
