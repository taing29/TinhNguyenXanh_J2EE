<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Danh mục - Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <style>
    body{display:flex;min-height:100vh}
    .sidebar{width:250px;background:#1b5e20;color:#fff;min-height:100vh;flex-shrink:0}
    .sidebar a{color:rgba(255,255,255,.8);text-decoration:none;padding:12px 20px;display:block;transition:.2s}
    .sidebar a:hover,.sidebar a.active{background:rgba(255,255,255,.15);color:#fff}
    .sidebar .brand{padding:20px;font-size:1.2rem;font-weight:700;border-bottom:1px solid rgba(255,255,255,.2)}
    .main{flex:1;background:#f8f9fa;overflow:auto}
  </style>
</head>
<body>
<div class="sidebar">
  <div class="brand">🌿 Admin Panel</div>
  <nav class="mt-2">
    <a th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
    <a th:href="@{/admin/events}"><i class="bi bi-calendar-event me-2"></i>Sự kiện</a>
    <a th:href="@{/admin/organizations}"><i class="bi bi-building me-2"></i>Tổ chức</a>
    <a th:href="@{/admin/users}"><i class="bi bi-people me-2"></i>Người dùng</a>
    <a th:href="@{/admin/categories}" class="active"><i class="bi bi-tags me-2"></i>Danh mục</a>
    <a th:href="@{/admin/reports}"><i class="bi bi-flag me-2"></i>Báo cáo</a>
    <hr style="border-color:rgba(255,255,255,.2);margin:8px 16px"/>
    <a th:href="@{/}"><i class="bi bi-house me-2"></i>Trang chủ</a>
    <form th:action="@{/auth/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn text-white w-100 text-start ps-4" type="submit">Đăng xuất</button>
    </form>
  </nav>
</div>
<div class="main p-4">
  <h3 class="fw-bold mb-4"><i class="bi bi-tags me-2"></i>Quản lý danh mục</h3>
  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="row g-4">
    <div class="col-md-4">
      <div class="card border-0 shadow-sm p-4">
        <h5 class="fw-bold mb-3">Thêm danh mục mới</h5>
        <form th:action="@{/admin/categories/create}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="mb-3">
            <label class="form-label">Tên danh mục</label>
            <input type="text" name="name" class="form-control" placeholder="VD: Môi trường, Y tế..." required/>
          </div>
          <button type="submit" class="btn btn-success w-100">
            <i class="bi bi-plus-lg me-1"></i>Thêm danh mục
          </button>
        </form>
      </div>
    </div>
    <div class="col-md-8">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <table class="table table-hover mb-0">
            <thead class="table-dark">
              <tr><th>#</th><th>Tên danh mục</th><th>Số sự kiện</th><th>Hành động</th></tr>
            </thead>
            <tbody>
              <tr th:each="cat,iter : ${categories}">
                <td th:text="${iter.count}"></td>
                <td><span class="badge bg-success fs-6" th:text="${cat.name}"></span></td>
                <td th:text="${cat.events != null ? cat.events.size() : 0}"></td>
                <td>
                  <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}" method="post"
                        onsubmit="return confirm('Xóa danh mục này?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger btn-sm">
                      <i class="bi bi-trash"></i>
                    </button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
