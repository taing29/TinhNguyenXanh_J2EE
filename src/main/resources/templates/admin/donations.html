<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/admin-layout :: head('Quản lý quyên góp')}"></head>
<body>
<div th:replace="~{shared/admin-layout :: sidebar('donations')}"></div>
<div class="main-content">
  <div class="content-area">
    <h3 class="fw-bold mb-4"><i class="bi bi-cash-stack me-2"></i>Quản lý quyên góp</h3>
    <div th:replace="~{shared/admin-layout :: flash}"></div>

    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card stat-card p-3 text-center">
          <h4 class="fw-bold mb-1" th:text="${donations.size()}">0</h4>
          <div class="text-muted">Tổng giao dịch</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stat-card p-3 text-center">
          <h4 class="fw-bold mb-1" th:text="${paidCount}">0</h4>
          <div class="text-muted">Đã thanh toán</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stat-card p-3 text-center">
          <h4 class="fw-bold mb-1" th:text="${totalAmount} + ' đ'">0</h4>
          <div class="text-muted">Tổng số tiền</div>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-dark">
            <tr>
              <th>#</th><th>Người ủng hộ</th><th>Số tiền</th><th>Số điện thoại</th><th>Trạng thái</th><th>Thời gian</th><th>Nội dung</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="donation,iter : ${donations}">
              <td th:text="${iter.count}"></td>
              <td class="fw-semibold" th:text="${donation.donorName}"></td>
              <td th:text="${donation.amount} + ' đ'"></td>
              <td th:text="${donation.phoneNumber}"></td>
              <td>
                <span class="badge" th:classappend="${donation.paid} ? 'bg-success' : 'bg-warning text-dark'" th:text="${donation.paid ? 'Đã thanh toán' : 'Chờ thanh toán'}"></span>
              </td>
              <td th:text="${#temporals.format(donation.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
              <td th:text="${donation.message ?: '-'}"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <p th:if="${#lists.isEmpty(donations)}" class="text-center text-muted py-4">Chưa có khoản quyên góp nào.</p>
  </div>
</div>
<th:block th:replace="~{shared/admin-layout :: scripts}"></th:block>
</body>
</html>
