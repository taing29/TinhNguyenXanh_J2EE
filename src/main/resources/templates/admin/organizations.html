<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/admin-layout :: head('Duyệt tổ chức')}"></head>
<body>
<div th:replace="~{shared/admin-layout :: sidebar('organizations')}"></div>
<div class="main-content">
  <div class="content-area">
    <h3 class="fw-bold mb-4"><i class="bi bi-building me-2"></i>Tổ chức chờ duyệt</h3>
    <div th:replace="~{shared/admin-layout :: flash}"></div>
    <div class="row g-4">
      <div th:each="org : ${pendingOrgs}" class="col-md-6">
        <div class="card border-0 shadow-sm h-100">
          <div class="card-body">
            <div class="d-flex align-items-center mb-3">
              <img th:if="${org.avatarUrl != null}" th:src="${org.avatarUrl}"
                   class="rounded-circle me-3" style="width:56px;height:56px;object-fit:cover" alt="avatar"/>
              <div th:unless="${org.avatarUrl != null}"
                   class="rounded-circle bg-success text-white d-flex align-items-center justify-content-center me-3"
                   style="width:56px;height:56px;font-size:1.5rem;font-weight:700"
                   th:text="${org.name.substring(0,1)}">O</div>
              <div>
                <h5 class="mb-0 fw-bold" th:text="${org.name}"></h5>
                <small class="text-muted" th:text="${org.organizationType}"></small>
              </div>
            </div>
            <p class="text-muted small" th:text="${#strings.abbreviate(org.description, 120)}"></p>
            <ul class="list-unstyled small text-muted">
              <li><i class="bi bi-envelope me-1"></i><span th:text="${org.contactEmail}"></span></li>
              <li><i class="bi bi-telephone me-1"></i><span th:text="${org.phoneNumber}"></span></li>
              <li><i class="bi bi-geo-alt me-1"></i><span th:text="${org.address}"></span></li>
            </ul>
            <div class="d-flex gap-2 mt-3">
              <form th:action="@{/admin/organizations/{id}/approve(id=${org.id})}" method="post" class="flex-fill">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-success w-100"><i class="bi bi-check-lg me-1"></i>Duyệt</button>
              </form>
              <form th:action="@{/admin/organizations/{id}/reject(id=${org.id})}" method="post" class="flex-fill">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-outline-danger w-100"><i class="bi bi-x-lg me-1"></i>Từ chối</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div th:if="${#lists.isEmpty(pendingOrgs)}" class="text-center py-5 text-muted">
      <i class="bi bi-building-check display-4"></i>
      <p class="mt-3">Không có tổ chức nào đang chờ duyệt</p>
    </div>
  </div>
</div>
<th:block th:replace="~{shared/admin-layout :: scripts}"></th:block>
</body>
</html>
