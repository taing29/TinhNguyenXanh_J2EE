<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Duyệt tổ chức - Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <style>
    body{display:flex;min-height:100vh}
    .sidebar{width:250px;background:#1b5e20;color:#fff;min-height:100vh;flex-shrink:0}
    .sidebar a{color:rgba(255,255,255,.8);text-decoration:none;padding:12px 20px;display:block;transition:.2s}
    .sidebar a:hover,.sidebar a.active{background:rgba(255,255,255,.15);color:#fff}
    .sidebar .brand{padding:20px;font-size:1.2rem;font-weight:700;border-bottom:1px solid rgba(255,255,255,.2)}
    .main{flex:1;background:#f8f9fa;overflow:auto}
  </style>
</head>
<body>
<div class="sidebar">
  <div class="brand">🌿 Admin Panel</div>
  <nav class="mt-2">
    <a th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
    <a th:href="@{/admin/events}"><i class="bi bi-calendar-event me-2"></i>Sự kiện</a>
    <a th:href="@{/admin/organizations}" class="active"><i class="bi bi-building me-2"></i>Tổ chức</a>
    <a th:href="@{/admin/users}"><i class="bi bi-people me-2"></i>Người dùng</a>
    <a th:href="@{/admin/categories}"><i class="bi bi-tags me-2"></i>Danh mục</a>
    <a th:href="@{/admin/reports}"><i class="bi bi-flag me-2"></i>Báo cáo</a>
    <hr style="border-color:rgba(255,255,255,.2);margin:8px 16px"/>
    <a th:href="@{/}"><i class="bi bi-house me-2"></i>Trang chủ</a>
    <form th:action="@{/auth/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn text-white w-100 text-start ps-4" type="submit">
        <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
      </button>
    </form>
  </nav>
</div>
<div class="main p-4">
  <h3 class="fw-bold mb-4"><i class="bi bi-building me-2"></i>Tổ chức chờ duyệt</h3>
  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="row g-4">
    <div th:each="org : ${pendingOrgs}" class="col-md-6">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body">
          <div class="d-flex align-items-center mb-3">
            <img th:if="${org.avatarUrl != null}" th:src="${org.avatarUrl}"
                 class="rounded-circle me-3" style="width:56px;height:56px;object-fit:cover" alt="avatar"/>
            <div th:unless="${org.avatarUrl != null}"
                 class="rounded-circle bg-success text-white d-flex align-items-center justify-content-center me-3"
                 style="width:56px;height:56px;font-size:1.5rem;font-weight:700"
                 th:text="${org.name.substring(0,1)}">O</div>
            <div>
              <h5 class="mb-0 fw-bold" th:text="${org.name}">Tên tổ chức</h5>
              <small class="text-muted" th:text="${org.organizationType}">Loại</small>
            </div>
          </div>
          <p class="text-muted small" th:text="${#strings.abbreviate(org.description, 120)}"></p>
          <ul class="list-unstyled small text-muted">
            <li><i class="bi bi-envelope me-1"></i><span th:text="${org.contactEmail}"></span></li>
            <li><i class="bi bi-telephone me-1"></i><span th:text="${org.phoneNumber}"></span></li>
            <li><i class="bi bi-geo-alt me-1"></i><span th:text="${org.address}"></span></li>
          </ul>
          <div class="d-flex gap-2 mt-3">
            <form th:action="@{/admin/organizations/{id}/approve(id=${org.id})}" method="post" class="flex-fill">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-success w-100">
                <i class="bi bi-check-lg me-1"></i>Duyệt
              </button>
            </form>
            <form th:action="@{/admin/organizations/{id}/reject(id=${org.id})}" method="post" class="flex-fill">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-outline-danger w-100">
                <i class="bi bi-x-lg me-1"></i>Từ chối
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div th:if="${#lists.isEmpty(pendingOrgs)}" class="text-center py-5 text-muted">
    <i class="bi bi-building-check display-4"></i>
    <p class="mt-3">Không có tổ chức nào đang chờ duyệt</p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
