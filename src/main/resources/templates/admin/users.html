<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/admin-layout :: head('Quản lý người dùng')}"></head>
<body>
<div th:replace="~{shared/admin-layout :: sidebar('users')}"></div>
<div class="main-content">
  <div class="content-area">
    <h3 class="fw-bold mb-4"><i class="bi bi-people me-2"></i>Quản lý người dùng</h3>
    <div th:replace="~{shared/admin-layout :: flash}"></div>
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <table class="table table-hover mb-0">
          <thead class="table-dark">
            <tr><th>#</th><th>Họ tên</th><th>Email</th><th>Vai trò</th><th>Ngày đăng ký</th><th>Trạng thái</th><th>Hành động</th></tr>
          </thead>
          <tbody>
            <tr th:each="user,iter : ${users}">
              <td th:text="${iter.count}"></td>
              <td th:text="${user.fullName}"></td>
              <td th:text="${user.email}"></td>
              <td>
                <span class="badge"
                      th:classappend="${user.role.name() == 'ADMIN'} ? 'bg-danger' : (${user.role.name() == 'ORGANIZER'} ? 'bg-primary' : 'bg-secondary')"
                      th:text="${user.role}"></span>
              </td>
              <td th:text="${#temporals.format(user.registeredDate,'dd/MM/yyyy')}"></td>
              <td>
                <span th:if="${!user.accountLocked}" class="badge bg-success">Hoạt động</span>
                <span th:if="${user.accountLocked}" class="badge bg-danger">Đã khóa</span>
              </td>
              <td>
                <form th:if="${!user.accountLocked}" th:action="@{/admin/users/{id}/lock(id=${user.id})}" method="post" class="d-inline">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-warning btn-sm" title="Khóa"><i class="bi bi-lock"></i></button>
                </form>
                <form th:if="${user.accountLocked}" th:action="@{/admin/users/{id}/unlock(id=${user.id})}" method="post" class="d-inline">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-success btn-sm" title="Mở khóa"><i class="bi bi-unlock"></i></button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<th:block th:replace="~{shared/admin-layout :: scripts}"></th:block>
</body>
</html>
