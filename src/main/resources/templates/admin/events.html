<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Quản lý sự kiện - Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <style>
    body{display:flex;min-height:100vh}
    .sidebar{width:250px;background:#1b5e20;color:#fff;min-height:100vh;flex-shrink:0}
    .sidebar a{color:rgba(255,255,255,.8);text-decoration:none;padding:12px 20px;display:block;transition:.2s}
    .sidebar a:hover,.sidebar a.active{background:rgba(255,255,255,.15);color:#fff}
    .sidebar .brand{padding:20px;font-size:1.2rem;font-weight:700;border-bottom:1px solid rgba(255,255,255,.2)}
    .main{flex:1;background:#f8f9fa;overflow:auto}
    .badge-pending{background:#ff9800}
    .badge-approved{background:#4caf50}
    .badge-rejected{background:#f44336}
    .badge-draft{background:#9e9e9e}
  </style>
</head>
<body>
<div class="sidebar">
  <div class="brand">🌿 Admin Panel</div>
  <nav class="mt-2">
    <a th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
    <a th:href="@{/admin/events}" class="active"><i class="bi bi-calendar-event me-2"></i>Sự kiện</a>
    <a th:href="@{/admin/organizations}"><i class="bi bi-building me-2"></i>Tổ chức</a>
    <a th:href="@{/admin/users}"><i class="bi bi-people me-2"></i>Người dùng</a>
    <a th:href="@{/admin/categories}"><i class="bi bi-tags me-2"></i>Danh mục</a>
    <a th:href="@{/admin/reports}"><i class="bi bi-flag me-2"></i>Báo cáo</a>
    <hr style="border-color:rgba(255,255,255,.2);margin:8px 16px"/>
    <a th:href="@{/}"><i class="bi bi-house me-2"></i>Trang chủ</a>
    <form th:action="@{/auth/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn text-white w-100 text-start ps-4" type="submit">
        <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
      </button>
    </form>
  </nav>
</div>
<div class="main p-4">
  <h3 class="fw-bold mb-4"><i class="bi bi-calendar-event me-2"></i>Quản lý sự kiện</h3>
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
    <span th:text="${success}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
    <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-dark">
          <tr>
            <th>#</th>
            <th>Tên sự kiện</th>
            <th>Tổ chức</th>
            <th>Danh mục</th>
            <th>Bắt đầu</th>
            <th>Trạng thái</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="event,iter : ${events}">
            <td th:text="${iter.count}"></td>
            <td>
              <a th:href="@{/events/{id}(id=${event.id})}" th:text="${event.title}" class="text-decoration-none fw-semibold"></a>
            </td>
            <td th:text="${event.organizationName}"></td>
            <td th:text="${event.categoryName}"></td>
            <td th:text="${#temporals.format(event.startTime,'dd/MM/yyyy')}"></td>
            <td>
              <span class="badge"
                    th:classappend="${event.status == 'approved'} ? 'badge-approved' : (${event.status == 'pending'} ? 'badge-pending' : (${event.status == 'rejected'} ? 'badge-rejected' : 'badge-draft'))"
                    th:text="${event.status}"></span>
            </td>
            <td>
              <div class="btn-group btn-group-sm">
                <form th:if="${event.status == 'pending'}" th:action="@{/admin/events/{id}/approve(id=${event.id})}" method="post" class="d-inline">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-success btn-sm" title="Duyệt">
                    <i class="bi bi-check-lg"></i>
                  </button>
                </form>
                <form th:if="${event.status == 'pending'}" th:action="@{/admin/events/{id}/reject(id=${event.id})}" method="post" class="d-inline">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-warning btn-sm" title="Từ chối">
                    <i class="bi bi-x-lg"></i>
                  </button>
                </form>
                <form th:action="@{/admin/events/{id}/delete(id=${event.id})}" method="post" class="d-inline"
                      onsubmit="return confirm('Xác nhận xóa sự kiện này?')">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-danger btn-sm" title="Xóa">
                    <i class="bi bi-trash"></i>
                  </button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <p th:if="${#lists.isEmpty(events)}" class="text-center text-muted py-4">Không có sự kiện nào.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
