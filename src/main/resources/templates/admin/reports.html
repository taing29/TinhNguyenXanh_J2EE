<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/admin-layout :: head('Báo cáo sự kiện')}"></head>
<body>
<div th:replace="~{shared/admin-layout :: sidebar('reports')}"></div>
<div class="main-content">
  <div class="content-area">
    <h3 class="fw-bold mb-4"><i class="bi bi-flag me-2"></i>Báo cáo sự kiện</h3>
    <div th:replace="~{shared/admin-layout :: flash}"></div>
    <div class="card border-0 shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-dark">
            <tr><th>#</th><th>Sự kiện</th><th>Người báo cáo</th><th>Lý do</th><th>Thời gian</th><th>Trạng thái</th><th></th></tr>
          </thead>
          <tbody>
            <tr th:each="r,iter : ${reports}">
              <td th:text="${iter.count}"></td>
              <td><a th:href="@{/events/{id}(id=${r.event.id})}" th:text="${r.event.title}"></a></td>
              <td th:text="${r.user.fullName}"></td>
              <td th:text="${r.reportReason}"></td>
              <td th:text="${#temporals.format(r.reportDate,'dd/MM/yyyy HH:mm')}"></td>
              <td><span class="badge bg-warning text-dark" th:text="${r.status}"></span></td>
              <td>
                <form th:action="@{/admin/reports/{id}/dismiss(id=${r.id})}" method="post">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-sm btn-outline-secondary">Dismiss</button>
                </form>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <p th:if="${#lists.isEmpty(reports)}" class="text-center text-muted mt-4">Không có báo cáo đang chờ xử lý.</p>
  </div>
</div>
<th:block th:replace="~{shared/admin-layout :: scripts}"></th:block>
</body>
</html>
