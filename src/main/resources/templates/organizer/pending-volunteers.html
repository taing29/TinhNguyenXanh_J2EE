<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/organizer-layout :: head('Duyệt tình nguyện viên')}"></head>
<body>
<div th:replace="~{shared/organizer-layout :: sidebar('pending')}"></div>
<div class="main-content">
  <div class="content-area">
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
      <div>
        <h1 class="h4 fw-bold text-dark mb-1">Duyệt tình nguyện viên</h1>
        <p class="text-muted mb-0 small">
          Các đăng ký <strong>chờ duyệt</strong> cho mọi sự kiện thuộc <span th:text="${org.name}">tổ chức</span>.
        </p>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <a th:href="@{/organizer/volunteers/export}" class="btn btn-outline-success btn-sm rounded-pill fw-semibold">
          <i class="bi bi-file-earmark-spreadsheet me-1"></i>Xuất Excel
        </a>
        <a th:href="@{/organizer/events}" class="btn btn-outline-secondary btn-sm rounded-pill">
          <i class="bi bi-calendar-event me-1"></i>Sự kiện
        </a>
      </div>
    </div>

    <div th:replace="~{shared/organizer-layout :: flash}"></div>

    <div class="stat-card overflow-hidden">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr class="small text-muted">
              <th class="ps-4">Sự kiện</th>
              <th>Tình nguyện viên</th>
              <th>Điện thoại</th>
              <th>Lý do / ghi chú</th>
              <th>Ngày đăng ký</th>
              <th class="text-end pe-4">Thao tác</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="reg : ${pendingList}">
              <td class="ps-4">
                <div class="fw-semibold text-dark" th:text="${reg.event.title}"></div>
                <div class="small text-muted" th:text="${#temporals.format(reg.event.startTime,'dd/MM/yyyy HH:mm')}"></div>
              </td>
              <td>
                <a th:href="@{/organizer/volunteers/{id}/profile(id=${reg.volunteer.id})}"
                   class="fw-semibold text-decoration-none" th:text="${reg.fullName}"></a>
                <div class="small text-muted" th:text="${reg.volunteer.email}"></div>
              </td>
              <td th:text="${reg.phone}"></td>
              <td><small class="text-secondary" th:text="${#strings.abbreviate(reg.reason, 80)}"></small></td>
              <td class="text-nowrap small" th:text="${#temporals.format(reg.registeredDate,'dd/MM/yyyy HH:mm')}"></td>
              <td class="text-end pe-4">
                <div class="btn-group btn-group-sm">
                  <form th:action="@{/organizer/registrations/{id}/approve(id=${reg.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="returnUrl" th:value="@{/organizer/pending-volunteers}"/>
                    <button type="submit" class="btn btn-success rounded-start-pill" title="Duyệt">
                      <i class="bi bi-check-lg"></i>
                    </button>
                  </form>
                  <form th:action="@{/organizer/registrations/{id}/reject(id=${reg.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" name="returnUrl" th:value="@{/organizer/pending-volunteers}"/>
                    <button type="submit" class="btn btn-outline-danger rounded-end-pill" title="Từ chối">
                      <i class="bi bi-x-lg"></i>
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <p th:if="${#lists.isEmpty(pendingList)}" class="text-center text-muted py-5 mb-0">
        <i class="bi bi-emoji-smile fs-2 d-block mb-2 opacity-50"></i>
        Không có đăng ký nào đang chờ duyệt.
      </p>
    </div>
  </div>
</div>
<th:block th:replace="~{shared/organizer-layout :: scripts}"></th:block>
</body>
</html>
