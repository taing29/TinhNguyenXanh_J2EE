<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Organizer Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <style>
    body{display:flex;min-height:100vh}
    .sidebar{width:240px;background:#1565c0;color:#fff;min-height:100vh;flex-shrink:0}
    .sidebar a{color:rgba(255,255,255,.85);text-decoration:none;padding:12px 20px;display:block;transition:.2s}
    .sidebar a:hover,.sidebar a.active{background:rgba(255,255,255,.15);color:#fff}
    .sidebar .brand{padding:20px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.2)}
    .main{flex:1;background:#f8f9fa;overflow:auto}
    .stat-card{border:none;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  </style>
</head>
<body>
<div class="sidebar">
  <div class="brand">🏢 Ban Tổ Chức</div>
  <nav class="mt-2">
    <a th:href="@{/organizer/dashboard}" class="active"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
    <a th:href="@{/organizer/events}"><i class="bi bi-calendar-event me-2"></i>Sự kiện của tôi</a>
    <a th:href="@{/organizer/events/create}"><i class="bi bi-plus-circle me-2"></i>Tạo sự kiện</a>
    <hr style="border-color:rgba(255,255,255,.2);margin:8px 16px"/>
    <a th:href="@{/}"><i class="bi bi-house me-2"></i>Trang chủ</a>
    <form th:action="@{/auth/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn text-white w-100 text-start ps-4" type="submit">
        <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
      </button>
    </form>
  </nav>
</div>
<div class="main p-4">
  <h3 class="fw-bold mb-1">Xin chào, <span th:text="${org.name}">Tổ chức</span> 👋</h3>
  <p class="text-muted mb-4">Quản lý các sự kiện của bạn</p>

  <div class="row g-4 mb-5">
    <div class="col-md-4">
      <div class="card stat-card p-4 text-center">
        <i class="bi bi-calendar-event display-5 text-primary mb-2"></i>
        <h3 class="fw-bold" th:text="${totalEvents}">0</h3>
        <p class="text-muted mb-0">Tổng sự kiện</p>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card stat-card p-4 text-center">
        <i class="bi bi-hourglass-split display-5 text-warning mb-2"></i>
        <h3 class="fw-bold" th:text="${pendingEvents}">0</h3>
        <p class="text-muted mb-0">Đang chờ duyệt</p>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card stat-card p-4 text-center">
        <i class="bi bi-check-circle display-5 text-success mb-2"></i>
        <h3 class="fw-bold" th:text="${approvedEvents}">0</h3>
        <p class="text-muted mb-0">Đã được duyệt</p>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="fw-bold">Sự kiện gần đây</h5>
    <a th:href="@{/organizer/events/create}" class="btn btn-primary btn-sm">
      <i class="bi bi-plus-lg me-1"></i>Tạo sự kiện mới
    </a>
  </div>
  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr><th>Tên sự kiện</th><th>Bắt đầu</th><th>Trạng thái</th><th>Hành động</th></tr>
        </thead>
        <tbody>
          <tr th:each="event : ${events}">
            <td th:text="${event.title}"></td>
            <td th:text="${#temporals.format(event.startTime,'dd/MM/yyyy')}"></td>
            <td>
              <span class="badge"
                    th:classappend="${event.status == 'approved'} ? 'bg-success' : (${event.status == 'pending'} ? 'bg-warning text-dark' : 'bg-secondary')"
                    th:text="${event.status}"></span>
            </td>
            <td>
              <a th:href="@{/organizer/events/{id}/volunteers(id=${event.id})}" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-people me-1"></i>Tình nguyện viên
              </a>
              <a th:href="@{/organizer/events/{id}/edit(id=${event.id})}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-pencil"></i>
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <p th:if="${#lists.isEmpty(events)}" class="text-center text-muted py-4">Bạn chưa có sự kiện nào.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
