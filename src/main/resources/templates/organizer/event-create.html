<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Tạo sự kiện</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <style>
    body{display:flex;min-height:100vh}
    .sidebar{width:240px;background:#1565c0;color:#fff;min-height:100vh;flex-shrink:0}
    .sidebar a{color:rgba(255,255,255,.85);text-decoration:none;padding:12px 20px;display:block;transition:.2s}
    .sidebar a:hover,.sidebar a.active{background:rgba(255,255,255,.15);color:#fff}
    .sidebar .brand{padding:20px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.2)}
    .main{flex:1;background:#f8f9fa;overflow:auto}
    .btn-primary{background:#1565c0;border-color:#1565c0}
  </style>
</head>
<body>
<div class="sidebar">
  <div class="brand">🏢 Ban Tổ Chức</div>
  <nav class="mt-2">
    <a th:href="@{/organizer/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
    <a th:href="@{/organizer/events}"><i class="bi bi-calendar-event me-2"></i>Sự kiện của tôi</a>
    <a th:href="@{/organizer/events/create}" class="active"><i class="bi bi-plus-circle me-2"></i>Tạo sự kiện</a>
    <hr style="border-color:rgba(255,255,255,.2);margin:8px 16px"/>
    <a th:href="@{/}"><i class="bi bi-house me-2"></i>Trang chủ</a>
    <form th:action="@{/auth/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn text-white w-100 text-start ps-4" type="submit">
        <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
      </button>
    </form>
  </nav>
</div>
<div class="main p-4">
  <h3 class="fw-bold mb-4"><i class="bi bi-plus-circle me-2"></i>Tạo sự kiện mới</h3>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="card border-0 shadow-sm p-4" style="max-width:800px">
    <form th:action="@{/organizer/events/create}" th:object="${eventDTO}"
          method="post" enctype="multipart/form-data">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="mb-3">
        <label class="form-label fw-semibold">Tên sự kiện <span class="text-danger">*</span></label>
        <input type="text" th:field="*{title}"
               th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
               class="form-control" placeholder="Nhập tên sự kiện"/>
        <div class="invalid-feedback" th:errors="*{title}"></div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Mô tả sự kiện</label>
        <textarea th:field="*{description}" class="form-control" rows="5"
                  placeholder="Mô tả chi tiết về sự kiện..."></textarea>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label fw-semibold">Thời gian bắt đầu <span class="text-danger">*</span></label>
          <input type="datetime-local" th:field="*{startTime}"
                 th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid'"
                 class="form-control"/>
          <div class="invalid-feedback" th:errors="*{startTime}"></div>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label fw-semibold">Thời gian kết thúc <span class="text-danger">*</span></label>
          <input type="datetime-local" th:field="*{endTime}"
                 th:classappend="${#fields.hasErrors('endTime')} ? 'is-invalid'"
                 class="form-control"/>
          <div class="invalid-feedback" th:errors="*{endTime}"></div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-8 mb-3">
          <label class="form-label fw-semibold">Địa điểm</label>
          <input type="text" th:field="*{location}" class="form-control"
                 placeholder="VD: Công viên Tao Đàn, TP.HCM"/>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label fw-semibold">Số lượng tình nguyện viên</label>
          <input type="number" th:field="*{maxVolunteers}" class="form-control" min="1" placeholder="50"/>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Danh mục</label>
        <select th:field="*{categoryId}" class="form-select">
          <option value="">-- Chọn danh mục --</option>
          <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
        </select>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Ảnh sự kiện</label>
        <input type="file" name="imageFile" class="form-control" accept="image/*"/>
        <small class="text-muted">Định dạng: JPG, PNG, WEBP. Tối đa 10MB.</small>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary px-4">
          <i class="bi bi-send me-2"></i>Gửi sự kiện
        </button>
        <a th:href="@{/organizer/events}" class="btn btn-outline-secondary px-4">Hủy</a>
      </div>
    </form>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
