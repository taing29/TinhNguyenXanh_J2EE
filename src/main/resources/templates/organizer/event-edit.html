<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/organizer-layout :: head('Chỉnh sửa sự kiện')}"></head>
<body>
<div th:replace="~{shared/organizer-layout :: sidebar('events')}"></div>
<div class="main-content">
  <div class="content-area">
    <div class="d-flex align-items-center mb-4">
      <a th:href="@{/organizer/events}" class="btn btn-outline-secondary btn-sm me-3">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h3 class="fw-bold mb-0"><i class="bi bi-pencil me-2"></i>Chỉnh sửa sự kiện</h3>
    </div>
    <div th:replace="~{shared/organizer-layout :: flash}"></div>

    <div class="card border-0 shadow-sm p-4" style="max-width:800px">
      <form th:action="@{/organizer/events/{id}/edit(id=${eventDTO.id})}" th:object="${eventDTO}"
            method="post" enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="mb-3">
          <label class="form-label fw-semibold">Tên sự kiện <span class="text-danger">*</span></label>
          <input type="text" th:field="*{title}"
                 th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                 class="form-control"/>
          <div class="invalid-feedback" th:errors="*{title}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Mô tả</label>
          <textarea th:field="*{description}" class="form-control" rows="5"></textarea>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Thời gian bắt đầu <span class="text-danger">*</span></label>
            <input type="datetime-local" th:field="*{startTime}"
                   th:classappend="${#fields.hasErrors('startTime')} ? 'is-invalid'"
                   class="form-control"/>
            <div class="invalid-feedback" th:errors="*{startTime}"></div>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Thời gian kết thúc <span class="text-danger">*</span></label>
            <input type="datetime-local" th:field="*{endTime}"
                   th:classappend="${#fields.hasErrors('endTime')} ? 'is-invalid'"
                   class="form-control"/>
            <div class="invalid-feedback" th:errors="*{endTime}"></div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-8 mb-3">
            <label class="form-label fw-semibold">Địa điểm</label>
            <input type="text" th:field="*{location}" class="form-control"
                   placeholder="VD: Công viên Tao Đàn, TP.HCM"/>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label fw-semibold">Số lượng TNV tối đa</label>
            <input type="number" th:field="*{maxVolunteers}" class="form-control" min="1"/>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Danh mục</label>
          <select th:field="*{categoryId}" class="form-select">
            <option value="">-- Chọn danh mục --</option>
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
          </select>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Ảnh sự kiện</label>
          <div th:if="${eventDTO.images != null}" class="mb-2">
            <img th:src="${eventDTO.images}" style="height:120px;object-fit:cover;border-radius:8px" alt="current"/>
            <div class="form-text">Ảnh hiện tại. Chọn file mới để thay thế.</div>
          </div>
          <input type="file" name="imageFile" class="form-control" accept="image/*"/>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-check-lg me-2"></i>Lưu thay đổi
          </button>
          <a th:href="@{/organizer/events}" class="btn btn-outline-secondary px-4">Hủy</a>
        </div>
      </form>
    </div>
  </div>
</div>
<th:block th:replace="~{shared/organizer-layout :: scripts}"></th:block>
<script>
(function() {
  // Set min for startTime = now (rounded to minute)
  function pad(n) { return String(n).padStart(2,'0'); }
  const now = new Date();
  const localNow = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
    .toISOString().slice(0,16);

  const startInput = document.querySelector('input[name="startTime"], input[th\\:field="*{startTime}"]') ||
                     document.querySelector('input[type="datetime-local"]');
  const endInput   = document.querySelectorAll('input[type="datetime-local"]')[1];

  // Try by name attr
  const allDT = document.querySelectorAll('input[type="datetime-local"]');
  if (allDT.length >= 1) allDT[0].min = localNow;

  if (allDT.length >= 2) {
    allDT[0].addEventListener('change', () => {
      allDT[1].min = allDT[0].value || localNow;
      if (allDT[1].value && allDT[1].value <= allDT[0].value) {
        allDT[1].value = '';
        allDT[1].setCustomValidity('Thời gian kết thúc phải sau thời gian bắt đầu');
      } else {
        allDT[1].setCustomValidity('');
      }
    });
    allDT[1].addEventListener('change', () => {
      if (allDT[0].value && allDT[1].value <= allDT[0].value) {
        allDT[1].setCustomValidity('Thời gian kết thúc phải sau thời gian bắt đầu');
        allDT[1].reportValidity();
      } else {
        allDT[1].setCustomValidity('');
      }
    });
  }
})();
</script>
</body>
</html>
