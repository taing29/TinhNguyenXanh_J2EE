<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Tình nguyện viên</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <style>
    body{display:flex;min-height:100vh}
    .sidebar{width:240px;background:#1565c0;color:#fff;min-height:100vh;flex-shrink:0}
    .sidebar a{color:rgba(255,255,255,.85);text-decoration:none;padding:12px 20px;display:block;transition:.2s}
    .sidebar a:hover,.sidebar a.active{background:rgba(255,255,255,.15);color:#fff}
    .sidebar .brand{padding:20px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.2)}
    .main{flex:1;background:#f8f9fa;overflow:auto}
  </style>
</head>
<body>
<div class="sidebar">
  <div class="brand">🏢 Ban Tổ Chức</div>
  <nav class="mt-2">
    <a th:href="@{/organizer/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
    <a th:href="@{/organizer/events}" class="active"><i class="bi bi-calendar-event me-2"></i>Sự kiện của tôi</a>
    <a th:href="@{/organizer/events/create}"><i class="bi bi-plus-circle me-2"></i>Tạo sự kiện</a>
    <hr style="border-color:rgba(255,255,255,.2);margin:8px 16px"/>
    <a th:href="@{/}"><i class="bi bi-house me-2"></i>Trang chủ</a>
    <form th:action="@{/auth/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn text-white w-100 text-start ps-4" type="submit">Đăng xuất</button>
    </form>
  </nav>
</div>
<div class="main p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-1">Danh sách tình nguyện viên</h3>
      <p class="text-muted mb-0">Sự kiện: <strong th:text="${event.title}"></strong></p>
    </div>
    <a th:href="@{/organizer/events}" class="btn btn-outline-secondary btn-sm">
      <i class="bi bi-arrow-left me-1"></i>Quay lại
    </a>
  </div>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <table class="table table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>#</th>
            <th>Họ tên</th>
            <th>Điện thoại</th>
            <th>Lý do</th>
            <th>Ngày đăng ký</th>
            <th>Trạng thái</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="reg,iter : ${registrations}">
            <td th:text="${iter.count}"></td>
            <td th:text="${reg.fullName}"></td>
            <td th:text="${reg.phone}"></td>
            <td><small th:text="${#strings.abbreviate(reg.reason, 60)}"></small></td>
            <td th:text="${#temporals.format(reg.registeredDate,'dd/MM/yyyy')}"></td>
            <td>
              <span class="badge"
                    th:classappend="${reg.status == 'Confirmed'} ? 'bg-success' : (${reg.status == 'Rejected'} ? 'bg-danger' : 'bg-warning text-dark')"
                    th:text="${reg.status}"></span>
            </td>
            <td>
              <div th:if="${reg.status == 'Pending'}" class="btn-group btn-group-sm">
                <form th:action="@{/organizer/registrations/{id}/approve(id=${reg.id})}" method="post" class="d-inline">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-success btn-sm" title="Xác nhận">
                    <i class="bi bi-check-lg"></i>
                  </button>
                </form>
                <form th:action="@{/organizer/registrations/{id}/reject(id=${reg.id})}" method="post" class="d-inline">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                  <button type="submit" class="btn btn-danger btn-sm" title="Từ chối">
                    <i class="bi bi-x-lg"></i>
                  </button>
                </form>
              </div>
              <span th:unless="${reg.status == 'Pending'}" class="text-muted small">Đã xử lý</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <p th:if="${#lists.isEmpty(registrations)}" class="text-center text-muted py-4">
    Chưa có tình nguyện viên đăng ký.
  </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
