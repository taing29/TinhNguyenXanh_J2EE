<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Sự kiện của tôi</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <style>
    body{display:flex;min-height:100vh}
    .sidebar{width:240px;background:#1565c0;color:#fff;min-height:100vh;flex-shrink:0}
    .sidebar a{color:rgba(255,255,255,.85);text-decoration:none;padding:12px 20px;display:block;transition:.2s}
    .sidebar a:hover,.sidebar a.active{background:rgba(255,255,255,.15);color:#fff}
    .sidebar .brand{padding:20px;font-weight:700;border-bottom:1px solid rgba(255,255,255,.2)}
    .main{flex:1;background:#f8f9fa;overflow:auto}
  </style>
</head>
<body>
<div class="sidebar">
  <div class="brand">🏢 Ban Tổ Chức</div>
  <nav class="mt-2">
    <a th:href="@{/organizer/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
    <a th:href="@{/organizer/events}" class="active"><i class="bi bi-calendar-event me-2"></i>Sự kiện của tôi</a>
    <a th:href="@{/organizer/events/create}"><i class="bi bi-plus-circle me-2"></i>Tạo sự kiện</a>
    <hr style="border-color:rgba(255,255,255,.2);margin:8px 16px"/>
    <a th:href="@{/}"><i class="bi bi-house me-2"></i>Trang chủ</a>
    <form th:action="@{/auth/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn text-white w-100 text-start ps-4" type="submit">
        <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
      </button>
    </form>
  </nav>
</div>
<div class="main p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold mb-0">Sự kiện của tôi</h3>
    <a th:href="@{/organizer/events/create}" class="btn btn-primary">
      <i class="bi bi-plus-circle me-1"></i>Tạo sự kiện
    </a>
  </div>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
        <tr>
          <th>Tên sự kiện</th>
          <th>Thời gian</th>
          <th>Trạng thái</th>
          <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="event : ${events}">
          <td th:text="${event.title}">Tên sự kiện</td>
          <td th:text="${#temporals.format(event.startTime,'dd/MM/yyyy HH:mm')}">01/01/2026</td>
          <td>
            <span class="badge"
                  th:classappend="${event.status == 'approved'} ? 'bg-success' : (${event.status == 'pending'} ? 'bg-warning text-dark' : 'bg-secondary')"
                  th:text="${event.status}">pending</span>
          </td>
          <td class="d-flex gap-2">
            <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-outline-primary btn-sm">Xem</a>
            <a th:href="@{/organizer/events/{id}/edit(id=${event.id})}" class="btn btn-outline-secondary btn-sm">Sửa</a>
            <a th:href="@{/organizer/events/{id}/volunteers(id=${event.id})}" class="btn btn-outline-success btn-sm">TNV</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <p th:if="${#lists.isEmpty(events)}" class="text-center text-muted mt-4">Bạn chưa có sự kiện nào.</p>
  <div class="mt-3">
    <a th:href="@{/organizer/dashboard}" class="btn btn-link ps-0">← Quay về dashboard</a>
  </div>
</div>
</body>
</html>
