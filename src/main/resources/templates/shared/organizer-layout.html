<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${pageTitle != null ? pageTitle + ' - Ban Tổ Chức | Tình Nguyện Xanh' : 'Ban Tổ Chức | Tình Nguyện Xanh'}">Ban Tổ Chức</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <style>
    :root {
      --org-sidebar: #0f3d24;
      --org-sidebar-accent: #166534;
      --org-sidebar-hover: rgba(255, 255, 255, 0.1);
      --org-shell-bg: #f1f5f9;
      --org-card: #ffffff;
      --org-border: rgba(15, 23, 42, 0.08);
    }
    body { display: flex; min-height: 100vh; margin: 0; background: var(--org-shell-bg); }
    .sidebar {
      width: 268px;
      background: linear-gradient(180deg, var(--org-sidebar) 0%, #0a2818 100%);
      color: #fff;
      min-height: 100vh;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      box-shadow: 8px 0 40px rgba(15, 23, 42, 0.12);
    }
    .sidebar .brand {
      padding: 1.35rem 1.25rem;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .sidebar .brand span.emoji { font-size: 1.35rem; line-height: 1; }
    .sidebar nav { flex: 1; padding: 0.75rem 0.65rem; display: flex; flex-direction: column; gap: 0.2rem; }
    .sidebar a {
      color: rgba(255, 255, 255, 0.88);
      text-decoration: none;
      padding: 0.72rem 1rem;
      display: flex;
      align-items: center;
      border-radius: 0.75rem;
      font-weight: 600;
      font-size: 0.94rem;
      transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
    }
    .sidebar a:hover { background: var(--org-sidebar-hover); color: #fff; transform: translateX(2px); }
    .sidebar a.active {
      background: linear-gradient(90deg, var(--org-sidebar-accent), #15803d);
      color: #fff;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
    }
    .sidebar a i { opacity: 0.95; width: 1.35rem; text-align: center; }
    .sidebar .nav-section-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.45);
      padding: 0.75rem 1rem 0.35rem;
      font-weight: 700;
    }
    .sidebar .sidebar-footer { padding: 0.75rem 1rem 1rem; border-top: 1px solid rgba(255, 255, 255, 0.1); }
    .sidebar .sidebar-footer .btn {
      color: rgba(255, 255, 255, 0.88);
      border-radius: 0.75rem;
      font-weight: 600;
    }
    .sidebar .sidebar-footer .btn:hover { color: #fff; background: var(--org-sidebar-hover); }
    .main-content {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .main-content .content-area { flex: 1; padding: clamp(1.25rem, 3vw, 2rem); max-width: 1400px; margin: 0 auto; width: 100%; }
    .stat-card {
      border: 1px solid var(--org-border);
      border-radius: 1.1rem;
      background: var(--org-card);
      box-shadow: 0 14px 40px rgba(15, 23, 42, 0.06);
    }
    .btn-primary {
      background: linear-gradient(135deg, #15803d, #16a34a);
      border: none;
      font-weight: 600;
    }
    .btn-primary:hover { background: linear-gradient(135deg, #14532d, #15803d); }
    .badge-pending { background: #f59e0b; color: #422006; }
    .badge-approved { background: #22c55e; }
    .badge-rejected { background: #ef4444; }
    .badge-draft { background: #94a3b8; }
  </style>
</head>
<body>

<!-- ===== ORGANIZER SIDEBAR FRAGMENT ===== -->
<div th:fragment="sidebar(activePage)" class="sidebar">
  <div class="brand">
    <span class="emoji">🌿</span>
    <span>Ban tổ chức</span>
  </div>
  <nav>
    <a th:href="@{/organizer/dashboard}" th:classappend="${activePage == 'dashboard'} ? ' active'">
      <i class="bi bi-grid-1x2-fill"></i>Dashboard
    </a>
    <a th:href="@{/organizer/events}" th:classappend="${activePage == 'events'} ? ' active'">
      <i class="bi bi-calendar-event"></i>Sự kiện của tôi
    </a>
    <a th:href="@{/organizer/pending-volunteers}" th:classappend="${activePage == 'pending'} ? ' active'">
      <i class="bi bi-person-check"></i>Duyệt tình nguyện viên
    </a>
    <a th:href="@{/organizer/events/create}" th:classappend="${activePage == 'create'} ? ' active'">
      <i class="bi bi-plus-circle"></i>Tạo sự kiện
    </a>
    <div class="nav-section-label">Dữ liệu</div>
    <a th:href="@{/organizer/volunteers/export}">
      <i class="bi bi-file-earmark-spreadsheet"></i>Xuất Excel (TNV)
    </a>
    <a th:href="@{/organizer/profile}" th:classappend="${activePage == 'profile'} ? ' active'">
      <i class="bi bi-building-gear"></i>Thông tin tổ chức
    </a>
    <div class="nav-section-label">Khác</div>
    <a th:href="@{/}"><i class="bi bi-house"></i>Trang chủ website</a>
  </nav>
  <div class="sidebar-footer">
    <form th:action="@{/auth/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn btn-sm w-100 text-start" type="submit">
        <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
      </button>
    </form>
  </div>
</div>

<!-- ===== FLASH MESSAGES (organizer) ===== -->
<div th:fragment="flash">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
</div>

<!-- ===== SCRIPTS ===== -->
<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
