<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
  <th:block th:fragment="shell(user, volunteer, totalRegs, confirmedRegs, activeTab)">
  <style>
    .profile-shell-sticky {
      position: sticky;
      top: 1rem;
    }

    .profile-shell-frame {
      position: relative;
    }

    .profile-hero,
    .profile-nav-card {
      border: 0;
      border-radius: 1.5rem;
      box-shadow: 0 18px 55px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    .profile-hero {
      position: relative;
      background: linear-gradient(135deg, #14532d 0%, #0f766e 100%);
      color: #fff;
    }

    .profile-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top right, rgba(255, 255, 255, 0.12), transparent 30%),
        radial-gradient(circle at bottom left, rgba(255, 255, 255, 0.08), transparent 24%);
      pointer-events: none;
    }

    .profile-hero-content {
      position: relative;
      z-index: 1;
    }

    .profile-hero-content.p-4,
    .profile-hero-content.p-xl-5 {
      padding: 1.25rem !important;
    }

    .profile-avatar {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.08));
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.16);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-initials {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 1.7rem;
      font-weight: 800;
      color: #fff;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02));
    }

    .status-badge {
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.5rem;
    }

    .summary-tile {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 1rem;
      padding: 0.55rem 0.65rem;
      backdrop-filter: blur(8px);
    }

    .summary-value {
      font-size: 1.02rem;
      line-height: 1.1;
      font-weight: 800;
      margin-bottom: 0.2rem;
    }

    .summary-label {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.78);
    }

    .profile-section-title {
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #15803d;
      margin-bottom: 1rem;
    }

    .profile-nav-link {
      border: 0;
      border-radius: 0.9rem;
      color: #1f2937;
      font-weight: 700;
      padding: 0.6rem 0.85rem;
      transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
    }

    .profile-nav-link:hover,
    .profile-nav-link:focus {
      background: #e8f6ed;
      color: #15803d;
      transform: translateX(2px);
    }

    .profile-nav-link.active {
      background: linear-gradient(135deg, #15803d 0%, #16a34a 100%);
      color: #fff !important;
      box-shadow: 0 12px 24px rgba(21, 128, 61, 0.2);
    }

    .profile-nav-link .nav-icon {
      width: 1.5rem;
      display: inline-flex;
      justify-content: center;
      flex-shrink: 0;
    }

    @media (max-width: 991.98px) {
      .profile-shell-sticky {
        position: static;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <div class="profile-shell-sticky profile-shell-frame"
      th:classappend="${activeTab == 'profile'} ? ' profile-shell--profile' : ''">
    <div class="card profile-hero">
      <div class="card-body profile-hero-content p-4 p-xl-5 text-center">
        <div class="profile-avatar mb-4">
          <img th:if="${user != null and user.avatarPath != null and !#strings.isEmpty(user.avatarPath)}"
               th:src="${user.avatarPath}"
               alt="Ảnh đại diện"/>
          <div th:unless="${user != null and user.avatarPath != null and !#strings.isEmpty(user.avatarPath)}"
               class="profile-initials"
               th:text="${user != null and user.fullName != null and !#strings.isEmpty(user.fullName) ? user.fullName.substring(0,1) : 'U'}">U</div>
        </div>

        <div class="d-flex flex-wrap justify-content-center gap-2 mb-3">
          <span class="badge text-bg-light text-success status-badge">Tình nguyện viên</span>
          <span th:if="${volunteer != null and volunteer.availability == 'Available'}"
                class="badge text-bg-success status-badge">Sẵn sàng</span>
          <span th:if="${volunteer != null and volunteer.availability == 'Busy'}"
                class="badge text-bg-warning status-badge text-dark">Bận</span>
          <span th:if="${volunteer != null and volunteer.availability == 'Inactive'}"
                class="badge text-bg-secondary status-badge">Không hoạt động</span>
        </div>

        <h2 class="fw-bold mb-1" th:text="${user != null ? user.fullName : 'Tình nguyện viên'}">Tên người dùng</h2>
        <p class="mb-1 text-white-50" th:text="${user != null ? user.email : ''}">email@example.com</p>
        <p class="mb-0 small text-white-50">
          Tham gia từ
          <span th:text="${user != null and user.registeredDate != null ? #temporals.format(user.registeredDate, 'dd/MM/yyyy') : 'chưa cập nhật'}">01/01/2024</span>
        </p>

        <div class="summary-grid mt-4" th:if="${totalRegs != null and confirmedRegs != null}">
          <div class="summary-tile">
            <div class="summary-value" th:text="${totalRegs}">0</div>
            <div class="summary-label">Sự kiện đăng ký</div>
          </div>
          <div class="summary-tile">
            <div class="summary-value" th:text="${confirmedRegs}">0</div>
            <div class="summary-label">Đã xác nhận</div>
          </div>
          <div class="summary-tile">
            <div class="summary-value"
                 th:text="${totalRegs > 0 ? #numbers.formatDecimal(confirmedRegs * 100.0 / totalRegs, 1, 0) + '%' : '0%'}">0%</div>
            <div class="summary-label">Tỉ lệ xác nhận</div>
          </div>
        </div>

        <div class="mt-3 d-grid gap-2 profile-hero-actions">
          <a th:href="@{/auth/profile/edit}"
             class="btn btn-light btn-sm w-100 fw-semibold d-inline-flex align-items-center justify-content-center gap-2 py-2"
             th:classappend="${activeTab != 'profile'} ? ' invisible' : ''">
            <i class="bi bi-pencil-square"></i>Chỉnh sửa hồ sơ
          </a>
          <a th:href="@{/events}"
             class="btn btn-light btn-sm w-100 fw-semibold d-inline-flex align-items-center justify-content-center gap-2 py-2"
             th:classappend="${activeTab == 'profile'} ? ' invisible' : ''">
            <i class="bi bi-compass"></i>Khám phá thêm
          </a>
        </div>
      </div>
    </div>

  <div class="card profile-nav-card mt-2">
      <div class="card-body p-3">
        <div class="profile-section-title mb-3">Điều hướng nhanh</div>
        <div class="nav nav-pills flex-column gap-2">
          <a th:href="@{/auth/profile}"
             th:classappend="${activeTab == 'profile'} ? ' active' : ''"
             class="nav-link profile-nav-link"
             aria-current="page">
            <span class="nav-icon"><i class="bi bi-person-circle"></i></span>
            Hồ sơ cá nhân
          </a>
           <a th:href="@{/auth/my-registrations}"
             th:classappend="${activeTab == 'registrations'} ? ' active' : ''"
             class="nav-link profile-nav-link">
            <span class="nav-icon"><i class="bi bi-calendar-check"></i></span>
            Đăng ký của tôi
          </a>
           <a th:href="@{/auth/my-favorites}"
             th:classappend="${activeTab == 'favorites'} ? ' active' : ''"
             class="nav-link profile-nav-link">
            <span class="nav-icon"><i class="bi bi-heart"></i></span>
            Sự kiện yêu thích
          </a>
          <a th:href="@{/events}"
             th:classappend="${activeTab == 'events'} ? ' active' : ''"
             class="nav-link profile-nav-link">
            <span class="nav-icon"><i class="bi bi-search"></i></span>
            Khám phá sự kiện
          </a>
        </div>
      </div>
    </div>
  </div>
</th:block>
</body>
</html>
