# ======= DATABASE =======
spring.datasource.url=jdbc:mysql://localhost:3306/tinhnguyenxanh?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ======= JPA / HIBERNATE =======
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ======= THYMELEAF =======
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ======= FILE UPLOAD =======
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# ======= EMAIL (Gmail) =======
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# No payment gateway. Use manual bank transfer only.
momo.api-url=https://test-payment.momo.vn/v2/gateway/api/create
momo.partner-code=MOMO
momo.access-key=F8BBA842ECF85
momo.secret-key=K951B6PE1waDMi640xX08PD3vg6EkVlz
momo.notify-url=http://localhost:8080/api/v1/payments/momo/ipn
momo.return-url=http://localhost:8080/payment/momo/result

# ======= SERVER =======
server.port=8080

# Error Handling
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false

# Logging
logging.level.root=WARN
logging.level.com.tinhnguyenxanh=DEBUG
