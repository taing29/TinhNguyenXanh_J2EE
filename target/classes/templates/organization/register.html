<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Đăng ký tổ chức</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <style>:root{--primary:#2e7d32}.btn-primary{background:var(--primary);border-color:var(--primary)} .navbar-brand{color:var(--primary)!important;font-weight:700}</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">🌿 Tình Nguyện Xanh</a>
    <a th:href="@{/organizations}" class="btn btn-outline-success btn-sm ms-auto">← Danh sách tổ chức</a>
  </div>
</nav>
<div class="container py-5">
  <div style="max-width:800px;margin:0 auto">
    <h2 class="fw-bold text-success mb-4"><i class="bi bi-building-add me-2"></i>Đăng ký tổ chức</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card border-0 shadow-sm p-4">
      <form th:action="@{/organizations/register}" th:object="${orgDTO}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <h5 class="fw-bold text-success mb-3 border-bottom pb-2">Thông tin cơ bản</h5>
        <div class="row">
          <div class="col-md-8 mb-3">
            <label class="form-label fw-semibold">Tên tổ chức <span class="text-danger">*</span></label>
            <input type="text" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                   class="form-control"/>
            <div class="invalid-feedback" th:errors="*{name}"></div>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label fw-semibold">Loại tổ chức <span class="text-danger">*</span></label>
            <select th:field="*{organizationType}" class="form-select">
              <option value="">-- Chọn loại --</option>
              <option value="NGO">NGO - Phi chính phủ</option>
              <option value="NPO">NPO - Phi lợi nhuận</option>
              <option value="Volunteer Group">Nhóm tình nguyện</option>
              <option value="Community">Cộng đồng</option>
              <option value="Other">Khác</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Mô tả <span class="text-danger">*</span></label>
          <textarea th:field="*{description}" class="form-control" rows="4"
                    placeholder="Mô tả về tổ chức của bạn..."></textarea>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Logo tổ chức</label>
          <input type="file" name="avatarFile" class="form-control" accept="image/*"/>
        </div>

        <h5 class="fw-bold text-success mb-3 border-bottom pb-2 mt-4">Thông tin liên hệ</h5>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Email liên hệ <span class="text-danger">*</span></label>
            <input type="email" th:field="*{contactEmail}" class="form-control"/>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Số điện thoại <span class="text-danger">*</span></label>
            <input type="text" th:field="*{phoneNumber}" class="form-control"/>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Website</label>
            <input type="text" th:field="*{website}" class="form-control" placeholder="https://..."/>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Facebook</label>
            <input type="text" th:field="*{facebookUrl}" class="form-control" placeholder="https://facebook.com/..."/>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Địa chỉ <span class="text-danger">*</span></label>
          <input type="text" th:field="*{address}" class="form-control" placeholder="Số nhà, đường..."/>
        </div>
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label fw-semibold">Tỉnh/Thành phố</label>
            <input type="text" th:field="*{city}" class="form-control"/>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label fw-semibold">Quận/Huyện</label>
            <input type="text" th:field="*{district}" class="form-control"/>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label fw-semibold">Phường/Xã</label>
            <input type="text" th:field="*{ward}" class="form-control"/>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Lĩnh vực hoạt động <span class="text-danger">*</span></label>
          <div class="row">
            <div class="col-md-4" th:each="area : ${ {'Môi trường','Y tế','Giáo dục','Trẻ em','Người cao tuổi','Động vật','Cộng đồng','Khác'} }">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="focusAreas" th:value="${area}" th:id="${'area-' + area}"/>
                <label class="form-check-label" th:for="${'area-' + area}" th:text="${area}"></label>
              </div>
            </div>
          </div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary px-5">
            <i class="bi bi-send me-2"></i>Gửi đăng ký
          </button>
          <a th:href="@{/organizations}" class="btn btn-outline-secondary px-4">Hủy</a>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
