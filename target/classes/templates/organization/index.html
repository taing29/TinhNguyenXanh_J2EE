<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/layout :: head('Tổ chức')}">
  <style>
    .org-card { border:none;box-shadow:0 2px 12px rgba(0,0,0,.08);transition:.3s; }
    .org-card:hover { transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.15); }
    .page-link { color:#2e7d32; }
    .page-item.active .page-link { background:#2e7d32;border-color:#2e7d32;color:#fff; }
  </style>
</head>
<body>
<nav th:replace="~{shared/layout :: navbar('organizations')}"></nav>
<div th:replace="~{shared/layout :: flash}"></div>
<main>
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold text-success mb-0"><i class="bi bi-building me-2"></i>Tổ chức đối tác</h2>
        <small class="text-muted" th:text="${totalOrgs} + ' tổ chức'"></small>
      </div>
      <a th:href="@{/organizations/register}" class="btn btn-outline-success btn-sm">
        <i class="bi bi-building-add me-1"></i>Đăng ký tổ chức
      </a>
    </div>

    <div class="row g-4">
      <div th:each="org : ${organizations}" class="col-md-4">
        <div class="card org-card h-100 p-3">
          <div class="d-flex align-items-center mb-3">
            <img th:if="${org.avatarUrl != null}" th:src="${org.avatarUrl}"
                 class="rounded-circle me-3" style="width:60px;height:60px;object-fit:cover" alt="org"/>
            <div th:unless="${org.avatarUrl != null}"
                 class="rounded-circle bg-success text-white d-flex align-items-center justify-content-center me-3"
                 style="width:60px;height:60px;font-size:1.5rem;font-weight:700"
                 th:text="${org.name.substring(0,1)}">O</div>
            <div>
              <h5 class="mb-0 fw-bold" th:text="${org.name}"></h5>
              <small class="text-muted" th:text="${org.organizationType}"></small>
            </div>
          </div>
          <p class="text-muted small flex-grow-1" th:text="${#strings.abbreviate(org.description, 100)}"></p>
          <div class="d-flex justify-content-between align-items-center mt-auto">
            <div th:if="${org.averageRating != null and org.totalReviews != null and org.totalReviews > 0}"
                 class="text-warning small">
              <i class="bi bi-star-fill"></i>
              <span th:text="${#numbers.formatDecimal(org.averageRating,1,1)}"></span>
              <span class="text-muted" th:text="'(' + ${org.totalReviews} + ')'"></span>
            </div>
            <div th:unless="${org.averageRating != null and org.totalReviews != null and org.totalReviews > 0}"></div>
            <a th:href="@{/organizations/{id}(id=${org.id})}" class="btn btn-primary btn-sm">Xem chi tiết</a>
          </div>
        </div>
      </div>
    </div>

    <p th:if="${#lists.isEmpty(organizations)}" class="text-center text-muted py-5">
      Chưa có tổ chức nào.
    </p>

    <!-- Pagination -->
    <nav th:if="${totalPages > 1}" class="mt-5 d-flex justify-content-center">
      <ul class="pagination">
        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
          <a class="page-link" th:href="@{/organizations(page=${currentPage - 1})}">
            <i class="bi bi-chevron-left"></i>
          </a>
        </li>
        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
            class="page-item" th:classappend="${i == currentPage} ? 'active'">
          <a class="page-link" th:href="@{/organizations(page=${i})}" th:text="${i + 1}"></a>
        </li>
        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
          <a class="page-link" th:href="@{/organizations(page=${currentPage + 1})}">
            <i class="bi bi-chevron-right"></i>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</main>
<footer th:replace="~{shared/layout :: footer}"></footer>
<th:block th:replace="~{shared/layout :: scripts}"></th:block>
</body>
</html>
