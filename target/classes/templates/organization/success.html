<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/layout :: head('Đăng ký thành công')}"></head>
<body>
<nav th:replace="~{shared/layout :: navbar('organizations')}"></nav>
<main>
  <div class="container py-5 text-center">
    <div th:if="${success}" class="mb-4">
      <i class="bi bi-check-circle-fill text-success" style="font-size:4rem"></i>
      <h2 class="fw-bold mt-3 text-success">Đăng ký thành công!</h2>
      <p class="text-muted">Tổ chức của bạn đã được gửi và đang chờ admin xét duyệt.</p>
    </div>
    <div th:if="${error}" class="mb-4">
      <i class="bi bi-x-circle-fill text-danger" style="font-size:4rem"></i>
      <h2 class="fw-bold text-danger" th:text="${error}"></h2>
    </div>
    <a th:href="@{/}" class="btn btn-success me-2">Về trang chủ</a>
    <a th:href="@{/events}" class="btn btn-outline-success">Khám phá sự kiện</a>
  </div>
</main>
<footer th:replace="~{shared/layout :: footer}"></footer>
<th:block th:replace="~{shared/layout :: scripts}"></th:block>
</body>
</html>
