<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/layout :: head('Tìm kiếm')}">
  <style>
    .event-card { transition: .3s; border: none; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .event-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  </style>
</head>
<body>
<nav th:replace="~{shared/layout :: navbar('')}"></nav>
<div th:replace="~{shared/layout :: flash}"></div>

<main>
  <div class="container py-5">
    <!-- Search bar -->
    <form th:action="@{/search}" method="get" class="mb-5">
      <div class="input-group input-group-lg" style="max-width:600px;margin:0 auto">
        <input name="keyword" type="text" class="form-control"
               th:value="${keyword}" placeholder="Tìm kiếm sự kiện..."/>
        <button class="btn btn-primary" type="submit">
          <i class="bi bi-search me-1"></i>Tìm
        </button>
      </div>
    </form>

    <!-- Results -->
    <div th:if="${keyword != null}">
      <h5 class="fw-bold mb-4 text-muted">
        Kết quả tìm kiếm cho: <span class="text-success" th:text="'&quot;' + ${keyword} + '&quot;'"></span>
        <span class="ms-2 badge bg-secondary" th:if="${events != null}" th:text="${events.size()} + ' kết quả'"></span>
      </h5>

      <div class="row g-4" th:if="${events != null and !#lists.isEmpty(events)}">
        <div th:each="event : ${events}" class="col-md-4">
          <div class="card event-card h-100">
            <img th:if="${event.images != null}" th:src="${event.images}"
                 class="card-img-top" style="height:200px;object-fit:cover" alt="event"/>
            <img th:unless="${event.images != null}"
                 src="https://via.placeholder.com/400x200?text=No+Image"
                 class="card-img-top" style="height:200px;object-fit:cover" alt="event"/>
            <div class="card-body d-flex flex-column">
              <span class="badge bg-success mb-2" style="width:fit-content"
                    th:text="${event.categoryName}"></span>
              <h5 class="card-title" th:text="${event.title}"></h5>
              <p class="text-muted small flex-grow-1"
                 th:text="${#strings.abbreviate(event.description, 100)}"></p>
              <div class="mt-auto">
                <p class="text-muted small mb-1">
                  <i class="bi bi-geo-alt me-1"></i><span th:text="${event.location}"></span>
                </p>
                <p class="text-muted small mb-2">
                  <i class="bi bi-calendar me-1"></i>
                  <span th:text="${#temporals.format(event.startTime,'dd/MM/yyyy HH:mm')}"></span>
                </p>
                <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-primary btn-sm w-100">
                  Xem chi tiết
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div th:if="${events == null or #lists.isEmpty(events)}" class="text-center py-5 text-muted">
        <i class="bi bi-search display-4"></i>
        <p class="mt-3">Không tìm thấy sự kiện nào phù hợp.</p>
        <a th:href="@{/events}" class="btn btn-outline-success mt-2">Xem tất cả sự kiện</a>
      </div>
    </div>

    <div th:unless="${keyword != null}" class="text-center py-5 text-muted">
      <i class="bi bi-search display-4"></i>
      <p class="mt-3">Nhập từ khoá để tìm kiếm sự kiện.</p>
    </div>
  </div>
</main>

<footer th:replace="~{shared/layout :: footer}"></footer>
<th:block th:replace="~{shared/layout :: scripts}"></th:block>
</body>
</html>
