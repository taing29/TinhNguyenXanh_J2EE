<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/layout :: head('Liên hệ')}"></head>
<body>
<nav th:replace="~{shared/layout :: navbar('about')}"></nav>
<div th:replace="~{shared/layout :: flash}"></div>

<main>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <h2 class="fw-bold text-success mb-2"><i class="bi bi-envelope me-2"></i>Liên hệ chúng tôi</h2>
        <p class="text-muted mb-4">Có câu hỏi hoặc muốn hợp tác? Hãy gửi tin nhắn cho chúng tôi.</p>

        <div class="row g-4">
          <!-- Form -->
          <div class="col-md-7">
            <div class="card border-0 shadow-sm p-4">
              <form th:action="@{/contact}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                  <label class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                  <input type="text" name="name" class="form-control" placeholder="Nguyễn Văn A" required/>
                </div>
                <div class="mb-3">
                  <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                  <input type="email" name="email" class="form-control" placeholder="your@email.com" required/>
                </div>
                <div class="mb-4">
                  <label class="form-label fw-semibold">Nội dung <span class="text-danger">*</span></label>
                  <textarea name="message" class="form-control" rows="5"
                            placeholder="Nội dung tin nhắn của bạn..." required></textarea>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                  <i class="bi bi-send me-2"></i>Gửi tin nhắn
                </button>
              </form>
            </div>
          </div>

          <!-- Contact info -->
          <div class="col-md-5">
            <div class="card border-0 shadow-sm p-4 h-100">
              <h5 class="fw-bold mb-4">Thông tin liên hệ</h5>
              <ul class="list-unstyled">
                <li class="mb-3 d-flex align-items-start">
                  <i class="bi bi-envelope-fill text-success me-3 mt-1"></i>
                  <div>
                    <p class="fw-semibold mb-0">Email</p>
                    <a href="mailto:contact@tinhnguyenxanh.vn" class="text-decoration-none text-muted">
                      contact@tinhnguyenxanh.vn
                    </a>
                  </div>
                </li>
                <li class="mb-3 d-flex align-items-start">
                  <i class="bi bi-telephone-fill text-success me-3 mt-1"></i>
                  <div>
                    <p class="fw-semibold mb-0">Điện thoại</p>
                    <span class="text-muted">0901 234 567</span>
                  </div>
                </li>
                <li class="mb-3 d-flex align-items-start">
                  <i class="bi bi-geo-alt-fill text-success me-3 mt-1"></i>
                  <div>
                    <p class="fw-semibold mb-0">Địa chỉ</p>
                    <span class="text-muted">TP. Hồ Chí Minh, Việt Nam</span>
                  </div>
                </li>
                <li class="d-flex align-items-start">
                  <i class="bi bi-clock-fill text-success me-3 mt-1"></i>
                  <div>
                    <p class="fw-semibold mb-0">Giờ làm việc</p>
                    <span class="text-muted">Thứ 2 – Thứ 6: 8:00 – 17:00</span>
                  </div>
                </li>
              </ul>
              <hr/>
              <div class="d-flex gap-2 mt-2">
                <a href="#" class="btn btn-outline-primary btn-sm"><i class="bi bi-facebook"></i></a>
                <a href="#" class="btn btn-outline-danger btn-sm"><i class="bi bi-instagram"></i></a>
                <a href="#" class="btn btn-outline-info btn-sm"><i class="bi bi-youtube"></i></a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{shared/layout :: footer}"></footer>
<th:block th:replace="~{shared/layout :: scripts}"></th:block>
</body>
</html>
