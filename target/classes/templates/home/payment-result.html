<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Kết quả thanh toán</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
</head>
<body>
<div class="container py-5 text-center">
  <div th:if="${success}">
    <i class="bi bi-check-circle-fill text-success" style="font-size:5rem"></i>
    <h2 class="fw-bold text-success mt-3">Quyên góp thành công! 🎉</h2>
    <p class="text-muted">Cảm ơn bạn đã ủng hộ Tình Nguyện Xanh.</p>
    <p class="text-muted small">Mã giao dịch: <code th:text="${orderId}"></code></p>
  </div>
  <div th:unless="${success}">
    <i class="bi bi-x-circle-fill text-danger" style="font-size:5rem"></i>
    <h2 class="fw-bold text-danger mt-3">Thanh toán thất bại</h2>
    <p class="text-muted">Giao dịch không thành công. Vui lòng thử lại.</p>
  </div>
  <div class="mt-4">
    <a th:href="@{/}" class="btn btn-success me-2">Về trang chủ</a>
    <a th:href="@{/donate}" class="btn btn-outline-success">Quyên góp lại</a>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
