<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/admin-layout :: head('Quản lý sự kiện')}"></head>
<body>
<div th:replace="~{shared/admin-layout :: sidebar('events')}"></div>
<div class="main-content">
  <div class="content-area">
    <h3 class="fw-bold mb-4"><i class="bi bi-calendar-event me-2"></i>Quản lý sự kiện</h3>
    <div th:replace="~{shared/admin-layout :: flash}"></div>
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <table class="table table-hover mb-0">
          <thead class="table-dark">
            <tr>
              <th>#</th><th>Tên sự kiện</th><th>Tổ chức</th><th>Danh mục</th>
              <th>Bắt đầu</th><th>Trạng thái</th><th>Hành động</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="event,iter : ${events}">
              <td th:text="${iter.count}"></td>
              <td>
                <a th:href="@{/events/{id}(id=${event.id})}" th:text="${event.title}" class="text-decoration-none fw-semibold"></a>
              </td>
              <td th:text="${event.organizationName}"></td>
              <td th:text="${event.categoryName}"></td>
              <td th:text="${#temporals.format(event.startTime,'dd/MM/yyyy')}"></td>
              <td>
                <span class="badge"
                      th:classappend="${event.status == 'approved'} ? 'badge-approved' : (${event.status == 'pending'} ? 'badge-pending' : (${event.status == 'rejected'} ? 'badge-rejected' : 'badge-draft'))"
                      th:text="${event.status}"></span>
              </td>
              <td>
                <div class="btn-group btn-group-sm">
                  <form th:if="${event.status == 'pending'}" th:action="@{/admin/events/{id}/approve(id=${event.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-success btn-sm" title="Duyệt"><i class="bi bi-check-lg"></i></button>
                  </form>
                  <form th:if="${event.status == 'pending'}" th:action="@{/admin/events/{id}/reject(id=${event.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-warning btn-sm" title="Từ chối"><i class="bi bi-x-lg"></i></button>
                  </form>
                  <form th:action="@{/admin/events/{id}/delete(id=${event.id})}" method="post" class="d-inline"
                        onsubmit="return confirm('Xác nhận xóa sự kiện này?')">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger btn-sm" title="Xóa"><i class="bi bi-trash"></i></button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <p th:if="${#lists.isEmpty(events)}" class="text-center text-muted py-4">Không có sự kiện nào.</p>
  </div>
</div>
<th:block th:replace="~{shared/admin-layout :: scripts}"></th:block>
</body>
</html>
