<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/admin-layout :: head('Quản lý đăng ký sự kiện')}"></head>
<body>
<div th:replace="~{shared/admin-layout :: sidebar('registrations')}"></div>
<div class="main-content">
  <div class="content-area">
    <h3 class="fw-bold mb-4"><i class="bi bi-journal-check me-2"></i>Quản lý đăng ký sự kiện</h3>
    <div th:replace="~{shared/admin-layout :: flash}"></div>

    <div class="row g-3 mb-4">
      <div class="col-md-3">
        <div class="card stat-card p-3 text-center">
          <h4 class="fw-bold mb-1" th:text="${totalRegistrations}">0</h4>
          <div class="text-muted">Tổng đăng ký</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card stat-card p-3 text-center">
          <h4 class="fw-bold mb-1" th:text="${pendingRegistrations}">0</h4>
          <div class="text-muted">Chờ duyệt</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card stat-card p-3 text-center">
          <h4 class="fw-bold mb-1" th:text="${confirmedRegistrations}">0</h4>
          <div class="text-muted">Đã xác nhận</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card stat-card p-3 text-center">
          <h4 class="fw-bold mb-1" th:text="${rejectedRegistrations}">0</h4>
          <div class="text-muted">Đã từ chối</div>
        </div>
      </div>
    </div>

    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-dark">
            <tr>
              <th>#</th><th>Sự kiện</th><th>Tình nguyện viên</th><th>Họ tên</th><th>Số điện thoại</th><th>Lý do</th><th>Trạng thái</th><th>Ngày đăng ký</th><th>Hành động</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="registration,iter : ${registrations}">
              <td th:text="${iter.count}"></td>
              <td class="fw-semibold" th:text="${registration.event != null ? registration.event.title : '-'}"></td>
              <td th:text="${registration.volunteer != null ? registration.volunteer.fullName : '-'}"></td>
              <td th:text="${registration.fullName}"></td>
              <td th:text="${registration.phone}"></td>
              <td th:text="${registration.reason}"></td>
              <td>
                <span class="badge"
                      th:classappend="${registration.status == 'Confirmed'} ? 'bg-success' : (${registration.status == 'Pending'} ? 'bg-warning text-dark' : 'bg-danger')"
                      th:text="${registration.status}"></span>
              </td>
              <td th:text="${#temporals.format(registration.registeredDate, 'dd/MM/yyyy HH:mm')}"></td>
              <td>
                <div class="btn-group btn-group-sm">
                  <form th:if="${registration.status == 'Pending'}" th:action="@{/admin/registrations/{id}/approve(id=${registration.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-success btn-sm" title="Xác nhận"><i class="bi bi-check-lg"></i></button>
                  </form>
                  <form th:if="${registration.status == 'Pending'}" th:action="@{/admin/registrations/{id}/reject(id=${registration.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger btn-sm" title="Từ chối"><i class="bi bi-x-lg"></i></button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <p th:if="${#lists.isEmpty(registrations)}" class="text-center text-muted py-4">Chưa có đăng ký sự kiện nào.</p>
  </div>
</div>
<th:block th:replace="~{shared/admin-layout :: scripts}"></th:block>
</body>
</html>
