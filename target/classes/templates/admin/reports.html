<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Admin - Báo cáo sự kiện</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <style>
    body{display:flex;min-height:100vh}
    .sidebar{width:250px;background:#1b5e20;color:#fff;min-height:100vh;flex-shrink:0}
    .sidebar a{color:rgba(255,255,255,.8);text-decoration:none;padding:12px 20px;display:block;transition:.2s}
    .sidebar a:hover,.sidebar a.active{background:rgba(255,255,255,.15);color:#fff}
    .sidebar .brand{padding:20px;font-size:1.2rem;font-weight:700;border-bottom:1px solid rgba(255,255,255,.2)}
    .main{flex:1;background:#f8f9fa;overflow:auto}
  </style>
</head>
<body>
<div class="sidebar">
  <div class="brand">🌿 Admin Panel</div>
  <nav class="mt-2">
    <a th:href="@{/admin/dashboard}"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
    <a th:href="@{/admin/events}"><i class="bi bi-calendar-event me-2"></i>Sự kiện</a>
    <a th:href="@{/admin/organizations}"><i class="bi bi-building me-2"></i>Tổ chức</a>
    <a th:href="@{/admin/users}"><i class="bi bi-people me-2"></i>Người dùng</a>
    <a th:href="@{/admin/categories}"><i class="bi bi-tags me-2"></i>Danh mục</a>
    <a th:href="@{/admin/reports}" class="active"><i class="bi bi-flag me-2"></i>Báo cáo</a>
    <hr style="border-color:rgba(255,255,255,.2);margin:8px 16px"/>
    <a th:href="@{/}"><i class="bi bi-house me-2"></i>Trang chủ</a>
    <form th:action="@{/auth/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn text-white w-100 text-start ps-4" type="submit">
        <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
      </button>
    </form>
  </nav>
</div>
<div class="main p-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold mb-0">Báo cáo sự kiện</h3>
    <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">Dashboard</a>
  </div>

  <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead class="table-light">
        <tr>
          <th>#</th>
          <th>Sự kiện</th>
          <th>Người báo cáo</th>
          <th>Lý do</th>
          <th>Thời gian</th>
          <th>Trạng thái</th>
          <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r,iter : ${reports}">
          <td th:text="${iter.count}">1</td>
          <td>
            <a th:href="@{/events/{id}(id=${r.event.id})}" th:text="${r.event.title}">Sự kiện</a>
          </td>
          <td th:text="${r.user.fullName}">Người dùng</td>
          <td th:text="${r.reportReason}">Lý do</td>
          <td th:text="${#temporals.format(r.reportDate,'dd/MM/yyyy HH:mm')}">01/01/2026 09:00</td>
          <td><span class="badge bg-warning text-dark" th:text="${r.status}">Pending</span></td>
          <td>
            <form th:action="@{/admin/reports/{id}/dismiss(id=${r.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn btn-sm btn-outline-danger">Dismiss</button>
            </form>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>

  <p th:if="${#lists.isEmpty(reports)}" class="text-center text-muted mt-4">Không có báo cáo đang chờ xử lý.</p>
</div>
</body>
</html>
