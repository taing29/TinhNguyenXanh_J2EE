<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Đăng nhập - Tình Nguyện Xanh</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <style>
    body{background:#f1f8e9;min-height:100vh;display:flex;align-items:center}
    .card{border:none;box-shadow:0 8px 32px rgba(46,125,50,.15);border-radius:16px}
    .btn-primary{background:#2e7d32;border-color:#2e7d32}
    .btn-primary:hover{background:#1b5e20}
    .brand{color:#2e7d32;font-weight:700;font-size:1.5rem}
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card p-4 mt-5">
        <div class="text-center mb-4">
          <div class="brand">🌿 Tình Nguyện Xanh</div>
          <p class="text-muted mt-1">Đăng nhập tài khoản</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <form th:action="@{/auth/login}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" name="email" class="form-control" placeholder="your@email.com" required/>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Mật khẩu</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
          </div>
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-primary btn-lg">Đăng nhập</button>
          </div>
        </form>

        <hr/>
        <p class="text-center mb-0">Chưa có tài khoản?
          <a th:href="@{/auth/register}" class="text-success fw-bold">Đăng ký ngay</a>
        </p>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
