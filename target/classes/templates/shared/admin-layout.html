<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(pageTitle)">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${pageTitle != null ? pageTitle + ' - Admin | Tình Nguyện Xanh' : 'Admin | Tình Nguyện Xanh'}">Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <style>
    :root { --sidebar-bg: #1b5e20; --sidebar-hover: rgba(255,255,255,.15); }
    body { display: flex; min-height: 100vh; }
    .sidebar { width: 250px; background: var(--sidebar-bg); color: #fff; min-height: 100vh; flex-shrink: 0; display: flex; flex-direction: column; }
    .sidebar .brand { padding: 20px; font-size: 1.1rem; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,.2); }
    .sidebar nav { flex: 1; padding-top: 8px; }
    .sidebar a { color: rgba(255,255,255,.85); text-decoration: none; padding: 11px 20px; display: flex; align-items: center; transition: .2s; }
    .sidebar a:hover, .sidebar a.active { background: var(--sidebar-hover); color: #fff; }
    .sidebar .sidebar-footer { padding: 12px 16px; border-top: 1px solid rgba(255,255,255,.2); }
    .sidebar .sidebar-footer .btn { color: rgba(255,255,255,.85); }
    .sidebar .sidebar-footer .btn:hover { color: #fff; background: var(--sidebar-hover); }
    .main-content { flex: 1; background: #f8f9fa; overflow: auto; display: flex; flex-direction: column; }
    .main-content .content-area { flex: 1; padding: 28px; }
    .stat-card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    .badge-pending { background: #ff9800; }
    .badge-approved { background: #4caf50; }
    .badge-rejected { background: #f44336; }
    .badge-draft { background: #9e9e9e; }
  </style>
</head>
<body>

<!-- ===== ADMIN SIDEBAR FRAGMENT ===== -->
<div th:fragment="sidebar(activePage)" class="sidebar">
  <div class="brand">🌿 Admin Panel</div>
  <nav>
    <a th:href="@{/admin/dashboard}" th:classappend="${activePage == 'dashboard'} ? ' active'">
      <i class="bi bi-speedometer2 me-2"></i>Dashboard
    </a>
    <a th:href="@{/admin/events}" th:classappend="${activePage == 'events'} ? ' active'">
      <i class="bi bi-calendar-event me-2"></i>Sự kiện
    </a>
    <a th:href="@{/admin/organizations}" th:classappend="${activePage == 'organizations'} ? ' active'">
      <i class="bi bi-building me-2"></i>Tổ chức
    </a>
    <a th:href="@{/admin/users}" th:classappend="${activePage == 'users'} ? ' active'">
      <i class="bi bi-people me-2"></i>Người dùng
    </a>
    <a th:href="@{/admin/donations}" th:classappend="${activePage == 'donations'} ? ' active'">
      <i class="bi bi-cash-stack me-2"></i>Quyên góp
    </a>
    <a th:href="@{/admin/subscriptions}" th:classappend="${activePage == 'subscriptions'} ? ' active'">
      <i class="bi bi-envelope-paper-heart me-2"></i>Đăng ký nhận tin
    </a>
    <a th:href="@{/admin/registrations}" th:classappend="${activePage == 'registrations'} ? ' active'">
      <i class="bi bi-journal-check me-2"></i>Đăng ký sự kiện
    </a>
    <a th:href="@{/admin/categories}" th:classappend="${activePage == 'categories'} ? ' active'">
      <i class="bi bi-tags me-2"></i>Danh mục
    </a>
    <a th:href="@{/admin/reports}" th:classappend="${activePage == 'reports'} ? ' active'">
      <i class="bi bi-flag me-2"></i>Báo cáo
    </a>
    <hr style="border-color:rgba(255,255,255,.2);margin:8px 16px"/>
    <a th:href="@{/}"><i class="bi bi-house me-2"></i>Trang chủ</a>
  </nav>
  <div class="sidebar-footer">
    <form th:action="@{/auth/logout}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <button class="btn btn-sm w-100 text-start" type="submit">
        <i class="bi bi-box-arrow-right me-2"></i>Đăng xuất
      </button>
    </form>
  </div>
</div>

<!-- ===== FLASH MESSAGES (admin) ===== -->
<div th:fragment="flash">
  <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <i class="bi bi-check-circle me-2"></i><span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-circle me-2"></i><span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
</div>

<!-- ===== SCRIPTS ===== -->
<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
