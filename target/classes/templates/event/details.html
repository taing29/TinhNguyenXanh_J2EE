<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{shared/layout :: head(${event.title})}">
  <style>
    .hero-img { width: 100%; height: 400px; object-fit: cover; border-radius: 16px; }
    .info-card { border: none; box-shadow: 0 2px 12px rgba(0,0,0,.08); border-radius: 12px; }
    .btn-register-muted { opacity: .45; filter: grayscale(30%); cursor: not-allowed; }
  </style>
</head>
<body>

<nav th:replace="~{shared/layout :: navbar('events')}"></nav>
<div th:replace="~{shared/layout :: flash}"></div>

<main>
  <div class="container py-5">
    <div class="row g-4">
      <!-- LEFT: Main content -->
      <div class="col-lg-8">
        <img th:if="${event.images != null}" th:src="${event.images}" class="hero-img mb-4" alt="event"/>
        <img th:unless="${event.images != null}"
             src="https://via.placeholder.com/800x400?text=No+Image" class="hero-img mb-4" alt="event"/>

        <div class="d-flex gap-2 mb-3">
          <span class="badge bg-success fs-6" th:text="${event.categoryName}"></span>
          <span class="badge fs-6"
                th:classappend="${event.status == 'approved'} ? 'bg-success' : 'bg-secondary'"
                th:text="${event.status}"></span>
        </div>

        <h1 class="fw-bold" th:text="${event.title}">Tên sự kiện</h1>
        <p class="text-muted">
          <i class="bi bi-building me-1"></i>
          <span th:text="${event.organizationName}">Tổ chức</span>
        </p>

        <hr/>
        <h5 class="fw-bold">Mô tả sự kiện</h5>
        <p th:text="${event.description}" class="text-secondary lh-lg"></p>

        <!-- COMMENTS -->
        <hr/>
        <h5 class="fw-bold"><i class="bi bi-chat-dots me-2"></i>Bình luận</h5>

        <div sec:authorize="isAuthenticated()" class="mb-4">
          <form th:action="@{/events/{id}/comment(id=${event.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="input-group">
              <input type="text" name="content" class="form-control" placeholder="Nhập bình luận..."/>
              <button class="btn btn-primary" type="submit"><i class="bi bi-send"></i></button>
            </div>
          </form>
        </div>

        <div th:each="comment : ${comments}" class="d-flex mb-3">
          <div class="flex-shrink-0">
            <div class="rounded-circle bg-success text-white d-flex align-items-center justify-content-center"
                 style="width:40px;height:40px;font-weight:700"
                 th:text="${comment.user.fullName.substring(0,1)}">A</div>
          </div>
          <div class="ms-3 flex-grow-1">
            <div class="bg-light rounded p-3">
              <p class="fw-bold mb-1" th:text="${comment.user.fullName}">Tên</p>
              <p class="mb-0" th:text="${comment.content}">Nội dung</p>
            </div>
            <small class="text-muted" th:text="${#temporals.format(comment.createdAt,'dd/MM/yyyy HH:mm')}"></small>
          </div>
        </div>

        <p th:if="${#lists.isEmpty(comments)}" class="text-muted">Chưa có bình luận nào.</p>
      </div>

      <!-- RIGHT: Info card -->
      <div class="col-lg-4">
        <div class="card info-card p-4 sticky-top" style="top:80px">
          <h5 class="fw-bold mb-3">Thông tin sự kiện</h5>

          <ul class="list-unstyled">
            <li class="mb-2">
              <i class="bi bi-calendar-event me-2 text-success"></i>
              <strong>Bắt đầu:</strong>
              <span th:text="${#temporals.format(event.startTime,'dd/MM/yyyy HH:mm')}"></span>
            </li>
            <li class="mb-2">
              <i class="bi bi-calendar-x me-2 text-success"></i>
              <strong>Kết thúc:</strong>
              <span th:text="${#temporals.format(event.endTime,'dd/MM/yyyy HH:mm')}"></span>
            </li>
            <li class="mb-2">
              <i class="bi bi-geo-alt me-2 text-success"></i>
              <strong>Địa điểm:</strong>
              <span th:text="${event.location}"></span>
            </li>
            <li class="mb-2">
              <i class="bi bi-people me-2 text-success"></i>
              <strong>Tình nguyện viên:</strong>
              <span th:text="${event.registeredCount + '/' + event.maxVolunteers}"></span>
            </li>
          </ul>

          <div class="progress mb-3" style="height:8px">
            <div class="progress-bar bg-success" role="progressbar"
                 th:style="'width:' + (${event.maxVolunteers > 0 ? event.registeredCount * 100 / event.maxVolunteers : 0}) + '%'"></div>
          </div>

          <div sec:authorize="isAuthenticated()">
            <div th:if="${alreadyRegistered}" class="mb-3">
              <p class="small text-success mb-2 text-center"><i class="bi bi-check-circle me-1"></i>Bạn đã đăng ký sự kiện này</p>
              <button type="button" class="btn btn-primary w-100 mb-2 btn-register-muted" disabled>
                <i class="bi bi-pencil-square me-2"></i>Đăng ký tham gia
              </button>
            </div>
            <div th:unless="${alreadyRegistered}">
              <button type="button" class="btn btn-primary w-100 mb-2" data-bs-toggle="modal" data-bs-target="#registerModal">
                <i class="bi bi-pencil-square me-2"></i>Đăng ký tham gia
              </button>
            </div>

            <form th:action="@{/events/{id}/favorite(id=${event.id})}" method="post">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <button type="submit" class="btn w-100"
                      th:classappend="${isFavorited} ? 'btn-danger' : 'btn-outline-danger'">
                <i th:classappend="${isFavorited} ? 'bi bi-heart-fill' : 'bi bi-heart'" class="me-2"></i>
                <span th:text="${isFavorited} ? 'Bỏ yêu thích' : 'Thêm yêu thích'"></span>
              </button>
            </form>

            <form th:action="@{/events/{id}/report(id=${event.id})}" method="post" class="mt-2">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
              <div class="input-group">
                <input type="text" name="reason" class="form-control form-control-sm"
                       maxlength="500" placeholder="Lý do báo cáo sự kiện"/>
                <button type="submit" class="btn btn-outline-warning btn-sm">Báo cáo</button>
              </div>
            </form>
          </div>

          <div sec:authorize="!isAuthenticated()" class="text-center">
            <a th:href="@{/auth/login}" class="btn btn-primary w-100">
              <i class="bi bi-person me-2"></i>Đăng nhập để đăng ký
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Register Modal -->
  <div class="modal fade" id="registerModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Đăng ký tham gia sự kiện</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form th:action="@{/events/{id}/register(id=${event.id})}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label fw-semibold">Họ và tên</label>
              <input type="text" name="fullName" class="form-control"
                     th:value="${volunteerFullName}" required/>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Số điện thoại</label>
              <input type="text" name="phone" class="form-control"
                     th:value="${volunteerPhone}" required/>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Lý do tham gia</label>
              <textarea name="reason" class="form-control" rows="3"
                        placeholder="Tại sao bạn muốn tham gia?" required></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
            <button type="submit" class="btn btn-primary">Xác nhận đăng ký</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</main>

<footer th:replace="~{shared/layout :: footer}"></footer>
<th:block th:replace="~{shared/layout :: scripts}"></th:block>
</body>
</html>
