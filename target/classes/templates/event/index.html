<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{shared/layout :: head('Sự kiện')}">
  <style>
    .event-card { transition:.3s;border:none;box-shadow:0 2px 8px rgba(0,0,0,.1); }
    .event-card:hover { transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.15); }
    .btn-fav { border:none;background:transparent;padding:0;line-height:1; }
    .btn-fav.favorited i { color:#dc3545; }
    .btn-fav:not(.favorited) i { color:#adb5bd; }
    .btn-fav:hover i { color:#dc3545; }
    .page-link { color:#2e7d32; }
    .page-item.active .page-link { background:#2e7d32;border-color:#2e7d32;color:#fff; }
  </style>
</head>
<body>
<nav th:replace="~{shared/layout :: navbar('events')}"></nav>
<div th:replace="~{shared/layout :: flash}"></div>

<main>
  <div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div>
        <h2 class="fw-bold text-success mb-0"><i class="bi bi-calendar-event me-2"></i>Tất cả sự kiện</h2>
        <small class="text-muted" th:text="${totalEvents} + ' sự kiện'"></small>
      </div>
      <form th:action="@{/search}" method="get" class="d-flex">
        <input name="keyword" class="form-control me-2" placeholder="Tìm kiếm sự kiện..."/>
        <button class="btn btn-outline-success" type="submit"><i class="bi bi-search"></i></button>
      </form>
    </div>

    <!-- Category filter -->
    <div class="d-flex gap-2 flex-wrap mb-4">
      <a th:href="@{/events}" class="btn btn-sm"
         th:classappend="${selectedCategory == null} ? 'btn-success' : 'btn-outline-success'">
        Tất cả
      </a>
      <a th:each="cat : ${categories}"
         th:href="@{/events(category=${cat.id})}"
         class="btn btn-sm"
         th:classappend="${selectedCategory != null and selectedCategory == cat.id.toString()} ? 'btn-success' : 'btn-outline-success'"
         th:text="${cat.name}"></a>
    </div>

    <div class="row g-4">
      <div th:each="event : ${events}" class="col-md-4">
        <div class="card event-card h-100" th:id="'event-' + ${event.id}">
          <img th:if="${event.images != null}" th:src="${event.images}"
               class="card-img-top" style="height:200px;object-fit:cover" alt="event"/>
          <img th:unless="${event.images != null}"
               src="https://via.placeholder.com/400x200?text=No+Image"
               class="card-img-top" style="height:200px;object-fit:cover" alt="event"/>
          <div class="card-body d-flex flex-column">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <span class="badge bg-success" style="width:fit-content" th:text="${event.categoryName}"></span>
              <!-- Favorite button (AJAX) -->
              <button sec:authorize="isAuthenticated()"
                      class="btn-fav"
                      th:attr="data-event-id=${event.id},data-csrf=${_csrf.token}"
                      onclick="toggleFav(this)">
                <i class="bi bi-heart-fill fs-5"></i>
              </button>
            </div>
            <h5 class="card-title" th:text="${event.title}"></h5>
            <p class="text-muted small flex-grow-1" th:text="${#strings.abbreviate(event.description, 100)}"></p>
            <div class="mt-auto">
              <p class="text-muted small mb-1"><i class="bi bi-geo-alt me-1"></i><span th:text="${event.location}"></span></p>
              <p class="text-muted small mb-2">
                <i class="bi bi-calendar me-1"></i>
                <span th:text="${#temporals.format(event.startTime,'dd/MM/yyyy HH:mm')}"></span>
              </p>
              <div class="d-flex justify-content-between align-items-center">
                <span class="badge bg-secondary">
                  <i class="bi bi-people me-1"></i>
                  <span th:text="${event.registeredCount + '/' + event.maxVolunteers}"></span>
                </span>
                <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-primary btn-sm">
                  Chi tiết <i class="bi bi-arrow-right"></i>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(events)}" class="text-center py-5 text-muted">
      <i class="bi bi-calendar-x display-4"></i>
      <p class="mt-3">Không có sự kiện nào.</p>
    </div>

    <!-- Pagination -->
    <nav th:if="${totalPages > 1}" class="mt-5 d-flex justify-content-center" aria-label="Phân trang">
      <ul class="pagination">
        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
          <a class="page-link"
             th:href="@{/events(page=${currentPage - 1}, category=${selectedCategory})}">
            <i class="bi bi-chevron-left"></i>
          </a>
        </li>
        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
            class="page-item" th:classappend="${i == currentPage} ? 'active'">
          <a class="page-link"
             th:href="@{/events(page=${i}, category=${selectedCategory})}"
             th:text="${i + 1}"></a>
        </li>
        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
          <a class="page-link"
             th:href="@{/events(page=${currentPage + 1}, category=${selectedCategory})}">
            <i class="bi bi-chevron-right"></i>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</main>

<footer th:replace="~{shared/layout :: footer}"></footer>
<th:block th:replace="~{shared/layout :: scripts}"></th:block>
<script th:inline="javascript">
const csrfToken = /*[[${_csrf != null ? _csrf.token : ''}]]*/ '';
const csrfHeader = /*[[${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}]]*/ 'X-CSRF-TOKEN';

async function toggleFav(btn) {
  const eventId = btn.dataset.eventId;
  try {
    const res = await fetch(`/events/${eventId}/favorite/ajax`, {
      method: 'POST',
      headers: { [csrfHeader]: csrfToken, 'Content-Type': 'application/json' }
    });
    if (res.ok) {
      const data = await res.json();
      btn.classList.toggle('favorited', data.favorited);
      showToast(data.favorited ? 'Đã thêm vào yêu thích ❤️' : 'Đã bỏ yêu thích');
    }
  } catch(e) { console.error(e); }
}

function showToast(msg) {
  let t = document.getElementById('fav-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'fav-toast';
    t.style.cssText = 'position:fixed;bottom:24px;right:24px;background:#2e7d32;color:#fff;padding:10px 20px;border-radius:8px;z-index:9999;font-size:.9rem;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:opacity .3s';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, 2500);
}
</script>
</body>
</html>
