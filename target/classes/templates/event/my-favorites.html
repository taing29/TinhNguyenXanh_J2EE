<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/><title>Yêu thích - Tình Nguyện Xanh</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"/>
  <style>footer{background:#1b5e20;color:#fff}.card{border:none;box-shadow:0 2px 8px rgba(0,0,0,.1)}</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-success" th:href="@{/}">🌿 Tình Nguyện Xanh</a>
    <ul class="navbar-nav ms-auto">
      <li class="nav-item"><a class="nav-link" th:href="@{/events}">Sự kiện</a></li>
      <li class="nav-item"><a class="nav-link" th:href="@{/events/my-registrations}">Đăng ký của tôi</a></li>
      <li class="nav-item"><a class="nav-link fw-bold text-success" th:href="@{/events/my-favorites}">Yêu thích</a></li>
    </ul>
  </div>
</nav>
<div class="container py-5">
  <h2 class="fw-bold text-success mb-4"><i class="bi bi-heart me-2"></i>Sự kiện yêu thích</h2>
  <div class="row g-4">
    <div th:each="fav : ${favorites}" class="col-md-4">
      <div class="card h-100">
        <img th:if="${fav.event.images != null}" th:src="${fav.event.images}"
             class="card-img-top" style="height:180px;object-fit:cover" alt="event"/>
        <img th:unless="${fav.event.images != null}"
             src="https://via.placeholder.com/400x180?text=No+Image"
             class="card-img-top" style="height:180px;object-fit:cover" alt="event"/>
        <div class="card-body">
          <h5 class="card-title" th:text="${fav.event.title}"></h5>
          <p class="text-muted small"><i class="bi bi-geo-alt me-1"></i><span th:text="${fav.event.location}"></span></p>
          <p class="text-muted small"><i class="bi bi-calendar me-1"></i>
            <span th:text="${#temporals.format(fav.event.startTime,'dd/MM/yyyy')}"></span>
          </p>
          <a th:href="@{/events/{id}(id=${fav.event.id})}" class="btn btn-primary btn-sm w-100">Xem chi tiết</a>
        </div>
      </div>
    </div>
  </div>
  <p th:if="${favorites == null or #lists.isEmpty(favorites)}" class="text-center text-muted py-4">
    Bạn chưa yêu thích sự kiện nào. <a th:href="@{/events}" class="text-success">Khám phá ngay!</a>
  </p>
</div>
<footer class="py-3 mt-5"><div class="container text-center"><p class="mb-0">🌿 Tình Nguyện Xanh &copy; 2025</p></div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
