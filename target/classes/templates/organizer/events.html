<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/organizer-layout :: head('Sự kiện của tôi')}"></head>
<body>
<div th:replace="~{shared/organizer-layout :: sidebar('events')}"></div>
<div class="main-content">
  <div class="content-area">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold mb-0">Sự kiện của tôi</h3>
      <a th:href="@{/organizer/events/create}" class="btn btn-primary">
        <i class="bi bi-plus-circle me-1"></i>Tạo sự kiện
      </a>
    </div>
    <div th:replace="~{shared/organizer-layout :: flash}"></div>

    <!-- Filter bar -->
    <form th:action="@{/organizer/events}" method="get" class="card border-0 shadow-sm p-3 mb-4">
      <div class="row g-2 align-items-end">
        <div class="col-md-4">
          <label class="form-label small fw-semibold mb-1">Trạng thái</label>
          <select name="status" class="form-select form-select-sm">
            <option value="" th:selected="${filterStatus == null or filterStatus == ''}">-- Tất cả --</option>
            <option value="pending"   th:selected="${filterStatus == 'pending'}">Chờ duyệt</option>
            <option value="approved"  th:selected="${filterStatus == 'approved'}">Đã duyệt</option>
            <option value="rejected"  th:selected="${filterStatus == 'rejected'}">Bị từ chối</option>
            <option value="completed" th:selected="${filterStatus == 'completed'}">Hoàn thành</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label small fw-semibold mb-1">Hiển thị</label>
          <select name="hidden" class="form-select form-select-sm">
            <option value="" th:selected="${filterHidden == null or filterHidden == ''}">-- Tất cả --</option>
            <option value="false" th:selected="${filterHidden == 'false'}">Đang hiển thị</option>
            <option value="true"  th:selected="${filterHidden == 'true'}">Đang ẩn</option>
          </select>
        </div>
        <div class="col-md-4 d-flex gap-2">
          <button type="submit" class="btn btn-outline-primary btn-sm">
            <i class="bi bi-funnel me-1"></i>Lọc
          </button>
          <a th:href="@{/organizer/events}" class="btn btn-outline-secondary btn-sm">Xóa lọc</a>
        </div>
      </div>
    </form>

    <div class="card border-0 shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>Tên sự kiện</th>
              <th>Thời gian</th>
              <th>Trạng thái</th>
              <th>Hiển thị</th>
              <th>TNV</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="event : ${events}"
                th:classappend="${event.hidden} ? 'table-secondary'">
              <td>
                <a th:href="@{/events/{id}(id=${event.id})}" th:text="${event.title}"
                   class="text-decoration-none fw-semibold"></a>
              </td>
              <td class="text-muted small"
                  th:text="${#temporals.format(event.startTime,'dd/MM/yyyy HH:mm')}"></td>
              <td>
                <span class="badge"
                      th:classappend="${event.status == 'approved'} ? 'bg-success' :
                                      (${event.status == 'pending'} ? 'bg-warning text-dark' :
                                      (${event.status == 'rejected'} ? 'bg-danger' : 'bg-secondary'))"
                      th:text="${event.status}"></span>
              </td>
              <td>
                <span th:if="${event.hidden}" class="badge bg-secondary">
                  <i class="bi bi-eye-slash me-1"></i>Ẩn
                </span>
                <span th:unless="${event.hidden}" class="badge bg-light text-dark border">
                  <i class="bi bi-eye me-1"></i>Hiện
                </span>
              </td>
              <td>
                <a th:href="@{/organizer/events/{id}/volunteers(id=${event.id})}"
                   class="text-decoration-none text-muted small">
                  <i class="bi bi-people me-1"></i>
                  <span th:text="${event.registeredCount}">0</span>/<span th:text="${event.maxVolunteers}">0</span>
                </a>
              </td>
              <td>
                <div class="d-flex gap-1 flex-wrap">
                  <a th:href="@{/organizer/events/{id}/volunteers(id=${event.id})}"
                     class="btn btn-outline-primary btn-sm" title="TNV">
                    <i class="bi bi-people"></i>
                  </a>
                  <a th:href="@{/organizer/events/{id}/edit(id=${event.id})}"
                     class="btn btn-outline-secondary btn-sm" title="Sửa">
                    <i class="bi bi-pencil"></i>
                  </a>
                  <form th:action="@{/organizer/events/{id}/toggle-hidden(id=${event.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-sm"
                            th:classappend="${event.hidden} ? 'btn-outline-success' : 'btn-outline-warning'"
                            th:title="${event.hidden} ? 'Hiện sự kiện' : 'Ẩn sự kiện'">
                      <i th:classappend="${event.hidden} ? 'bi bi-eye' : 'bi bi-eye-slash'"></i>
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <p th:if="${#lists.isEmpty(events)}" class="text-center text-muted mt-4 py-4">
      <i class="bi bi-calendar-x display-6 d-block mb-2"></i>
      Không có sự kiện nào phù hợp.
    </p>
  </div>
</div>
<th:block th:replace="~{shared/organizer-layout :: scripts}"></th:block>
</body>
</html>
