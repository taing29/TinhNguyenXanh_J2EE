<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/organizer-layout :: head('Sự kiện của tôi')}"></head>
<body>
<div th:replace="~{shared/organizer-layout :: sidebar('events')}"></div>
<div class="main-content">
  <div class="content-area">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold mb-0">Sự kiện của tôi</h3>
      <a th:href="@{/organizer/events/create}" class="btn btn-primary">
        <i class="bi bi-plus-circle me-1"></i>Tạo sự kiện
      </a>
    </div>
    <div th:replace="~{shared/organizer-layout :: flash}"></div>
    <div class="card border-0 shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr><th>Tên sự kiện</th><th>Thời gian</th><th>Trạng thái</th><th>Hành động</th></tr>
          </thead>
          <tbody>
            <tr th:each="event : ${events}">
              <td th:text="${event.title}"></td>
              <td th:text="${#temporals.format(event.startTime,'dd/MM/yyyy HH:mm')}"></td>
              <td>
                <span class="badge"
                      th:classappend="${event.status == 'approved'} ? 'bg-success' : (${event.status == 'pending'} ? 'bg-warning text-dark' : 'bg-secondary')"
                      th:text="${event.status}"></span>
              </td>
              <td>
                <a th:href="@{/events/{id}(id=${event.id})}" class="btn btn-outline-primary btn-sm">Xem</a>
                <a th:href="@{/organizer/events/{id}/edit(id=${event.id})}" class="btn btn-outline-secondary btn-sm">Sửa</a>
                <a th:href="@{/organizer/events/{id}/volunteers(id=${event.id})}" class="btn btn-outline-success btn-sm">TNV</a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <p th:if="${#lists.isEmpty(events)}" class="text-center text-muted mt-4">Bạn chưa có sự kiện nào.</p>
  </div>
</div>
<th:block th:replace="~{shared/organizer-layout :: scripts}"></th:block>
</body>
</html>
