<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/organizer-layout :: head('Dashboard')}"></head>
<body>
<div th:replace="~{shared/organizer-layout :: sidebar('dashboard')}"></div>
<div class="main-content">
  <div class="content-area">
    <h3 class="fw-bold mb-1">Xin chào, <span th:text="${org.name}">Tổ chức</span> 👋</h3>
    <p class="text-muted mb-4">Quản lý các sự kiện của bạn</p>
    <div th:replace="~{shared/organizer-layout :: flash}"></div>

    <div class="row g-4 mb-5">
      <div class="col-md-4">
        <div class="card stat-card p-4 text-center">
          <i class="bi bi-calendar-event display-5 text-primary mb-2"></i>
          <h3 class="fw-bold" th:text="${totalEvents}">0</h3>
          <p class="text-muted mb-0">Tổng sự kiện</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stat-card p-4 text-center">
          <i class="bi bi-hourglass-split display-5 text-warning mb-2"></i>
          <h3 class="fw-bold" th:text="${pendingEvents}">0</h3>
          <p class="text-muted mb-0">Đang chờ duyệt</p>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card stat-card p-4 text-center">
          <i class="bi bi-check-circle display-5 text-success mb-2"></i>
          <h3 class="fw-bold" th:text="${approvedEvents}">0</h3>
          <p class="text-muted mb-0">Đã được duyệt</p>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="fw-bold">Sự kiện gần đây</h5>
      <a th:href="@{/organizer/events/create}" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-lg me-1"></i>Tạo sự kiện mới
      </a>
    </div>
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr><th>Tên sự kiện</th><th>Bắt đầu</th><th>Trạng thái</th><th>Hành động</th></tr>
          </thead>
          <tbody>
            <tr th:each="event : ${events}">
              <td th:text="${event.title}"></td>
              <td th:text="${#temporals.format(event.startTime,'dd/MM/yyyy')}"></td>
              <td>
                <span class="badge"
                      th:classappend="${event.status == 'approved'} ? 'bg-success' : (${event.status == 'pending'} ? 'bg-warning text-dark' : 'bg-secondary')"
                      th:text="${event.status}"></span>
              </td>
              <td>
                <a th:href="@{/organizer/events/{id}/volunteers(id=${event.id})}" class="btn btn-outline-primary btn-sm">
                  <i class="bi bi-people me-1"></i>TNV
                </a>
                <a th:href="@{/organizer/events/{id}/edit(id=${event.id})}" class="btn btn-outline-secondary btn-sm">
                  <i class="bi bi-pencil"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <p th:if="${#lists.isEmpty(events)}" class="text-center text-muted py-4">Bạn chưa có sự kiện nào.</p>
  </div>
</div>
<th:block th:replace="~{shared/organizer-layout :: scripts}"></th:block>
</body>
</html>
