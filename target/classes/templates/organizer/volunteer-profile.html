<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/organizer-layout :: head('Hồ sơ TNV')}">
  <style>
    .avatar-circle { width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#2e7d32,#66bb6a);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:700;color:#fff; }
    .skill-tag { background:#e8f5e9;color:#2e7d32;border-radius:20px;padding:3px 12px;font-size:.82rem;display:inline-block;margin:2px; }
  </style>
</head>
<body>
<div th:replace="~{shared/organizer-layout :: sidebar('events')}"></div>
<div class="main-content">
  <div class="content-area">
    <div class="d-flex align-items-center mb-4">
      <button onclick="history.back()" class="btn btn-outline-secondary btn-sm me-3">
        <i class="bi bi-arrow-left"></i>
      </button>
      <h3 class="fw-bold mb-0"><i class="bi bi-person me-2"></i>Hồ sơ tình nguyện viên</h3>
    </div>

    <div class="row g-4" style="max-width:800px">
      <div class="col-md-4">
        <div class="card border-0 shadow-sm p-4 text-center">
          <div class="d-flex justify-content-center mb-3">
            <img th:if="${volunteer.avatarUrl != null}" th:src="${volunteer.avatarUrl}"
                 class="rounded-circle" style="width:80px;height:80px;object-fit:cover" alt="avatar"/>
            <div th:unless="${volunteer.avatarUrl != null}" class="avatar-circle"
                 th:text="${volunteer.fullName.substring(0,1)}">A</div>
          </div>
          <h5 class="fw-bold mb-1" th:text="${volunteer.fullName}"></h5>
          <p class="text-muted small mb-2" th:text="${volunteer.email}"></p>
          <span th:if="${volunteer.availability == 'Available'}"
                class="badge bg-success-subtle text-success border border-success">Sẵn sàng</span>
          <span th:if="${volunteer.availability == 'Busy'}"
                class="badge bg-warning-subtle text-warning border border-warning">Bận</span>
          <span th:if="${volunteer.availability == 'Inactive'}"
                class="badge bg-secondary-subtle text-secondary border border-secondary">Không hoạt động</span>
        </div>
      </div>

      <div class="col-md-8">
        <div class="card border-0 shadow-sm p-4">
          <h6 class="fw-bold text-success mb-3">Thông tin liên hệ</h6>
          <ul class="list-unstyled">
            <li class="mb-2" th:if="${volunteer.phone != null}">
              <i class="bi bi-telephone me-2 text-muted"></i><span th:text="${volunteer.phone}"></span>
            </li>
            <li class="mb-2" th:if="${volunteer.address != null}">
              <i class="bi bi-geo-alt me-2 text-muted"></i><span th:text="${volunteer.address}"></span>
            </li>
            <li class="mb-2">
              <i class="bi bi-calendar me-2 text-muted"></i>
              Tham gia: <span th:text="${#temporals.format(volunteer.joinedDate,'dd/MM/yyyy')}"></span>
            </li>
          </ul>

          <div th:if="${volunteer.bio != null and !#strings.isEmpty(volunteer.bio)}" class="mt-3">
            <h6 class="fw-bold text-success">Giới thiệu</h6>
            <p class="text-secondary" th:text="${volunteer.bio}"></p>
          </div>

          <div th:if="${volunteer.skills != null and !#strings.isEmpty(volunteer.skills)}" class="mt-3">
            <h6 class="fw-bold text-success mb-2">Kỹ năng</h6>
            <span th:each="skill : ${#strings.arraySplit(volunteer.skills, ',')}"
                  th:text="${#strings.trim(skill)}" class="skill-tag"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<th:block th:replace="~{shared/organizer-layout :: scripts}"></th:block>
</body>
</html>
