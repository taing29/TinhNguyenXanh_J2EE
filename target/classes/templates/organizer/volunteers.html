<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/organizer-layout :: head('Tình nguyện viên')}"></head>
<body>
<div th:replace="~{shared/organizer-layout :: sidebar('events')}"></div>
<div class="main-content">
  <div class="content-area">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h3 class="fw-bold mb-1">Danh sách tình nguyện viên</h3>
        <p class="text-muted mb-0">Sự kiện: <strong th:text="${event.title}"></strong></p>
      </div>
      <a th:href="@{/organizer/events}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Quay lại
      </a>
    </div>
    <div th:replace="~{shared/organizer-layout :: flash}"></div>
    <div class="card border-0 shadow-sm">
      <div class="card-body p-0">
        <table class="table table-hover mb-0">
          <thead class="table-light">
            <tr><th>#</th><th>Họ tên</th><th>Điện thoại</th><th>Lý do</th><th>Ngày đăng ký</th><th>Trạng thái</th><th>Hành động</th></tr>
          </thead>
          <tbody>
            <tr th:each="reg,iter : ${registrations}">
              <td th:text="${iter.count}"></td>
              <td th:text="${reg.fullName}"></td>
              <td th:text="${reg.phone}"></td>
              <td><small th:text="${#strings.abbreviate(reg.reason, 60)}"></small></td>
              <td th:text="${#temporals.format(reg.registeredDate,'dd/MM/yyyy')}"></td>
              <td>
                <span class="badge"
                      th:classappend="${reg.status == 'Confirmed'} ? 'bg-success' : (${reg.status == 'Rejected'} ? 'bg-danger' : 'bg-warning text-dark')"
                      th:text="${reg.status}"></span>
              </td>
              <td>
                <div th:if="${reg.status == 'Pending'}" class="btn-group btn-group-sm">
                  <form th:action="@{/organizer/registrations/{id}/approve(id=${reg.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-success btn-sm" title="Xác nhận"><i class="bi bi-check-lg"></i></button>
                  </form>
                  <form th:action="@{/organizer/registrations/{id}/reject(id=${reg.id})}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger btn-sm" title="Từ chối"><i class="bi bi-x-lg"></i></button>
                  </form>
                </div>
                <span th:unless="${reg.status == 'Pending'}" class="text-muted small">Đã xử lý</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <p th:if="${#lists.isEmpty(registrations)}" class="text-center text-muted py-4">
      Chưa có tình nguyện viên đăng ký.
    </p>
  </div>
</div>
<th:block th:replace="~{shared/organizer-layout :: scripts}"></th:block>
</body>
</html>
