<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{shared/organizer-layout :: head('Thông tin tổ chức')}"></head>
<body>
<div th:replace="~{shared/organizer-layout :: sidebar('profile')}"></div>
<div class="main-content">
  <div class="content-area">
    <h3 class="fw-bold mb-4"><i class="bi bi-building-gear me-2"></i>Thông tin tổ chức</h3>
    <div th:replace="~{shared/organizer-layout :: flash}"></div>

    <div class="card border-0 shadow-sm p-4" style="max-width:800px">
      <form th:action="@{/organizer/profile}" th:object="${orgDTO}"
            method="post" enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <h6 class="fw-bold text-success mb-3 border-bottom pb-2">Thông tin cơ bản</h6>
        <div class="row">
          <div class="col-md-8 mb-3">
            <label class="form-label fw-semibold">Tên tổ chức <span class="text-danger">*</span></label>
            <input type="text" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                   class="form-control"/>
            <div class="invalid-feedback" th:errors="*{name}"></div>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label fw-semibold">Loại tổ chức</label>
            <select th:field="*{organizationType}" class="form-select">
              <option value="NGO">NGO - Phi chính phủ</option>
              <option value="NPO">NPO - Phi lợi nhuận</option>
              <option value="Volunteer Group">Nhóm tình nguyện</option>
              <option value="Community">Cộng đồng</option>
              <option value="Other">Khác</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Mô tả <span class="text-danger">*</span></label>
          <textarea th:field="*{description}" class="form-control" rows="4"></textarea>
          <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Logo tổ chức</label>
          <div th:if="${orgDTO.avatarUrl != null}" class="mb-2">
            <img th:src="${orgDTO.avatarUrl}" class="rounded-circle"
                 style="width:60px;height:60px;object-fit:cover" alt="logo"/>
            <span class="text-muted small ms-2">Logo hiện tại</span>
          </div>
          <input type="file" name="avatarFile" class="form-control" accept="image/*"/>
        </div>

        <h6 class="fw-bold text-success mb-3 border-bottom pb-2 mt-4">Liên hệ</h6>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
            <input type="email" th:field="*{contactEmail}" class="form-control"/>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Điện thoại <span class="text-danger">*</span></label>
            <input type="text" th:field="*{phoneNumber}" class="form-control"/>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Website</label>
            <input type="text" th:field="*{website}" class="form-control" placeholder="https://..."/>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Facebook</label>
            <input type="text" th:field="*{facebookUrl}" class="form-control" placeholder="https://facebook.com/..."/>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Địa chỉ</label>
          <input type="text" th:field="*{address}" class="form-control"/>
        </div>
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label fw-semibold">Tỉnh/Thành phố</label>
            <input type="text" th:field="*{city}" class="form-control"/>
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label fw-semibold">Quận/Huyện</label>
            <input type="text" th:field="*{district}" class="form-control"/>
          </div>
          <div class="col-md-4 mb-4">
            <label class="form-label fw-semibold">Zalo</label>
            <input type="text" th:field="*{zaloNumber}" class="form-control" placeholder="Số Zalo"/>
          </div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-check-lg me-2"></i>Lưu thay đổi
          </button>
          <a th:href="@{/organizer/dashboard}" class="btn btn-outline-secondary px-4">Hủy</a>
        </div>
      </form>
    </div>
  </div>
</div>
<th:block th:replace="~{shared/organizer-layout :: scripts}"></th:block>
</body>
</html>
